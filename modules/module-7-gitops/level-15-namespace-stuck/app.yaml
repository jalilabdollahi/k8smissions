apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-sandbox
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitserver.gitops-git.svc.cluster.local:8080/cgi-bin/git/sandbox.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: payments-sandbox
  syncPolicy:
    automated:
      prune: true

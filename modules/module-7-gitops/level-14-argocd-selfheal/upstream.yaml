apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-upstream-code
data:
  up.py: |
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            time.sleep(0.6)
            self.send_response(200)
            self.send_header("Content-Length", "2")
            self.end_headers()
            self.wfile.write(b"ok")

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-upstream
spec:
  replicas: 1
  selector:
    matchLabels: {app: ledger-upstream}
  template:
    metadata:
      labels: {app: ledger-upstream}
    spec:
      containers:
      - name: up
        image: python:3.12-alpine
        command: ["python", "/code/up.py"]
        volumeMounts:
        - {name: code, mountPath: /code}
      volumes:
      - name: code
        configMap: {name: ledger-upstream-code}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-upstream
spec:
  selector: {app: ledger-upstream}
  ports:
  - port: 80
    targetPort: 8080

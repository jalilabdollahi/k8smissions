namePrefix: stg-
resources:
- ../../base
labels:
- pairs: {env: staging}
  includeSelectors: true
replicas:
- name: checkout
  count: 2
patches:
- target: {kind: Deployment, name: checkout}
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/args/1
      value: -text=checkout staging

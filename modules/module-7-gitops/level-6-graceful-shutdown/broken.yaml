apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: k8smissions
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
      maxSurge: 25%
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog}
    spec:
      containers:
      - name: catalog
        image: hashicorp/http-echo:1.0
        args: ["-listen=:5678", "-text=catalog ok"]
        ports:
        - containerPort: 5678
        readinessProbe:
          httpGet: {path: /, port: 5678}
          periodSeconds: 1
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "10"]
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: k8smissions
spec:
  selector: {app: catalog}
  ports:
  - port: 80
    targetPort: 5678

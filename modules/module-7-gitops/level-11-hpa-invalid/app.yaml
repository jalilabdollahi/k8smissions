apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reports
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitserver.gitops-git.svc.cluster.local:8080/cgi-bin/git/reports.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: k8smissions
  syncPolicy:
    automated:
      prune: true

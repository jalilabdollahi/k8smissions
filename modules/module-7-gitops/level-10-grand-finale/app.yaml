apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grand-finale-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitserver.gitops-git.svc.cluster.local:8080/cgi-bin/git/finale.git
    targetRevision: release-2.3
    path: chart
    helm:
      valueFiles:
      - values-prod.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: k8smissions
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

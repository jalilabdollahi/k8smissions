apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: sandboxed
handler: runc
overhead:
  podFixed:
    memory: 700Mi
    cpu: 10m
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-batch-sizing
  namespace: k8smissions
data:
  measured-working-set-mi: "300"
  note: "p99 RSS of one ledger-batch process over the last 30 nights (profiling run, ticket PLAT-2210)"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-batch
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: ledger-batch}
  template:
    metadata:
      labels: {app: ledger-batch}
    spec:
      runtimeClassName: sandboxed
      containers:
      - name: reconcile
        image: busybox:1.37
        command: ["sh", "-c", "echo ledger reconciliation worker ready; while true; do sleep 30; done"]
        resources:
          requests: {cpu: 50m, memory: 900Mi}

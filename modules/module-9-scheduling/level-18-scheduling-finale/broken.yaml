apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-frontend
  namespace: k8smissions
spec:
  replicas: 4
  selector:
    matchLabels: {app: shop, tier: frontend}
  template:
    metadata:
      labels: {app: shop, tier: frontend}
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: zone
        minDomains: 2
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels: {app: shop, tier: frontend}
      containers:
      - name: web
        image: busybox:1.37
        command: ["sh", "-c", "mkdir -p /www; echo \"frontend $HOSTNAME\" > /www/index.html; exec httpd -f -p 8080 -h /www"]
        ports: [{containerPort: 8080}]
        readinessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 2
        resources:
          requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-cart
  namespace: k8smissions
spec:
  replicas: 2
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: shop, tier: cart}
  template:
    metadata:
      labels: {app: shop, tier: cart}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels: {app: shop}
      containers:
      - name: cart
        image: busybox:1.37
        command: ["sh", "-c", "mkdir -p /www; echo \"cart $HOSTNAME\" > /www/index.html; exec httpd -f -p 8080 -h /www"]
        ports: [{containerPort: 8080}]
        readinessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 2
        resources:
          requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-agent
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: shop-agent}
  template:
    metadata:
      labels: {app: shop-agent}
    spec:
      containers:
      - name: agent
        image: busybox:1.37
        command: ["sh", "-c", "mkdir -p /tmp/w; exec httpd -f -p 8125 -h /tmp/w"]
        ports:
        - {containerPort: 8125, hostPort: 8125}
        readinessProbe:
          tcpSocket: {port: 8125}
          periodSeconds: 2
        resources:
          requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-frontend
  namespace: k8smissions
spec:
  selector: {app: shop, tier: frontend}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: shop-cart
  namespace: k8smissions
spec:
  selector: {app: shop, tier: cart}
  ports: [{port: 80, targetPort: 8080}]

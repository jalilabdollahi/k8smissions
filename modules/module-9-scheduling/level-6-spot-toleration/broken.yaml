apiVersion: apps/v1
kind: Deployment
metadata:
  name: render-farm
  namespace: k8smissions
spec:
  replicas: 4
  selector:
    matchLabels: {app: render-farm}
  template:
    metadata:
      labels: {app: render-farm}
    spec:
      nodeSelector:
        lifecycle: spot
      containers:
      - name: renderer
        image: registry.k8s.io/pause:3.10
        resources:
          requests: {cpu: 100m, memory: 64Mi}

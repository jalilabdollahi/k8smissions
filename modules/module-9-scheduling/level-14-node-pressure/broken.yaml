apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: k8smissions
spec:
  limits:
  - type: Container
    default:
      ephemeral-storage: 50Mi
    defaultRequest:
      ephemeral-storage: 20Mi
      cpu: 10m
      memory: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-compactor
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: log-compactor}
  template:
    metadata:
      labels: {app: log-compactor}
    spec:
      containers:
      - name: compactor
        image: busybox:1.37
        command:
        - sh
        - -c
        - |
          mkdir -p /work
          echo "compacting segment..."
          dd if=/dev/zero of=/work/compacted.bin bs=1M count=120 2>/dev/null
          echo "compaction written"
          while true; do sleep 30; done

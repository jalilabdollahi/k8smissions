apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-cache
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: session-cache}
  template:
    metadata:
      labels: {app: session-cache}
    spec:
      nodeSelector:
        disktype: nvme
      tolerations:
      - key: maintenance
        operator: Equal
        value: nightly
        effect: NoExecute
        tolerationSeconds: 20
      containers:
      - name: cache
        image: registry.k8s.io/pause:3.10
        resources:
          requests: {cpu: 10m, memory: 16Mi}

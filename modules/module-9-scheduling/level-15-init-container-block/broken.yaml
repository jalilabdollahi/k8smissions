apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-migrator
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: payments-migrator}
  template:
    metadata:
      labels: {app: payments-migrator}
    spec:
      initContainers:
      - name: db-migrate
        image: python:3.12-alpine
        command:
        - python
        - -c
        - |
          buf = b"\x01" * (550 * 1024 * 1024)
          print("loading schema snapshot,", len(buf) // (1024 * 1024), "MiB in memory")
          print("migrated 214 tables")
        resources:
          requests: {cpu: 50m, memory: 1500Mi}
          limits: {memory: 1500Mi}
      containers:
      - name: migrator-api
        image: busybox:1.37
        command: ["sh", "-c", "echo migrator api ready; while true; do sleep 30; done"]
        resources:
          requests: {cpu: 50m, memory: 100Mi}
          limits: {memory: 200Mi}

apiVersion: tekton.dev/v1
kind: Task
metadata:
  namespace: k8smissions
  name: unit-tests
spec:
  params:
  - name: suite
    type: string
  steps:
  - name: test
    image: busybox:1.36
    onError: continue
    script: |
      #!/bin/sh
      echo "running suite $(params.suite)"
      case "$(params.suite)" in
        regression)
          echo "FAIL ledger_rounding_test: expected 10.01, got 10.00"
          echo "FAIL ledger_fx_cents_test: expected 3.35, got 3.34"
          echo "2 failed, 38 passed"
          exit 1
          ;;
        *)
          echo "12 passed"
          ;;
      esac
  - name: report
    image: busybox:1.36
    script: |
      #!/bin/sh
      echo "test step exit code: $(cat $(steps.step-test.exitCode.path))"
      echo "report: archived test summary for ledger"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  namespace: k8smissions
  name: deploy-ledger
spec:
  steps:
  - name: rollout
    image: busybox:1.36
    script: |
      #!/bin/sh
      echo "DEPLOYED ledger to production"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  namespace: k8smissions
  name: ship-ledger
spec:
  params:
  - name: suite
    type: string
    default: smoke
  tasks:
  - name: unit-tests
    params:
    - name: suite
      value: $(params.suite)
    taskRef:
      name: unit-tests
  - name: deploy
    runAfter: ["unit-tests"]
    taskRef:
      name: deploy-ledger
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  namespace: k8smissions
  name: ship-ledger-0612
spec:
  pipelineRef:
    name: ship-ledger
  params:
  - name: suite
    value: regression

apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: k8smissions
  name: releaser
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: k8smissions
  name: ledger-releaser
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: k8smissions
  name: releaser-ledger
subjects:
- kind: ServiceAccount
  name: releaser
  namespace: k8smissions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ledger-releaser
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: k8smissions
  name: ledger-api
spec:
  replicas: 3
  revisionHistoryLimit: 0
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 1}
  selector:
    matchLabels: {app: ledger-api}
  template:
    metadata:
      labels: {app: ledger-api}
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:0.2.1
        args: ["-listen=:5678", "-text=ledger-ok"]
        ports:
        - containerPort: 5678
        readinessProbe:
          httpGet: {path: /, port: 5678}
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  namespace: k8smissions
  name: ledger-api
spec:
  selector: {app: ledger-api}
  ports:
  - port: 80
    targetPort: 5678
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  namespace: k8smissions
  name: release-ledger
spec:
  params:
  - name: tag
    type: string
  tasks:
  - name: deploy
    params:
    - name: tag
      value: $(params.tag)
    taskSpec:
      params:
      - name: tag
      steps:
      - name: roll
        image: alpine/kubectl:1.36.0
        script: |
          #!/bin/sh
          set -e
          kubectl set image deployment/ledger-api api=hashicorp/http-echo:$(params.tag)
          kubectl rollout status deployment/ledger-api --timeout=30s
  finally:
  - name: rollback
    when:
    - input: $(tasks.status)
      operator: in
      values: ["Error"]
    taskSpec:
      steps:
      - name: undo
        image: alpine/kubectl:1.36.0
        script: |
          #!/bin/sh
          set -e
          kubectl rollout undo deployment/ledger-api
          kubectl rollout status deployment/ledger-api --timeout=60s
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  namespace: k8smissions
  name: release-ledger-0907
spec:
  pipelineRef:
    name: release-ledger
  taskRunTemplate:
    serviceAccountName: releaser
  params:
  - name: tag
    value: 0.2.9-typo

apiVersion: v1
kind: Pod
metadata:
  name: welcome-page
  namespace: k8smissions
  labels:
    app: welcome-page
spec:
  containers:
  - name: web
    image: nginx:1.27-alpine
    command: ["echo", "welcome to acme"]
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: welcome-page
  namespace: k8smissions
spec:
  selector:
    app: welcome-page
  ports:
  - port: 80
    targetPort: 80

apiVersion: v1
kind: Pod
metadata:
  name: cache-warm
  namespace: k8smissions
  labels:
    app: cache-warm
spec:
  nodeSelector:
    disktype: ssd
  containers:
  - name: cache
    image: nginx:1.27-alpine
    ports:
    - containerPort: 80
    readinessProbe:
      httpGet: {path: /, port: 80}
      periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: cache-warm
  namespace: k8smissions
spec:
  selector:
    app: cache-warm
  ports:
  - port: 80
    targetPort: 80

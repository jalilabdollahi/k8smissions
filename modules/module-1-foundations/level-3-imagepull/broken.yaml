apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-page
  namespace: k8smissions
data:
  index.html: "<h1>Acme storefront</h1>\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: storefront}
  template:
    metadata:
      labels: {app: storefront}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpne # lint: allow-image
        ports:
        - containerPort: 80
        volumeMounts:
        - {name: page, mountPath: /usr/share/nginx/html}
      volumes:
      - name: page
        configMap: {name: storefront-page}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-canary
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: storefront-canary}
  template:
    metadata:
      labels: {app: storefront-canary}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - {name: page, mountPath: /usr/share/nginx/html}
      volumes:
      - name: page
        configMap: {name: storefront-page}
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: k8smissions
spec:
  selector:
    app: storefront
  ports:
  - port: 80
    targetPort: 80

apiVersion: v1
kind: Pod
metadata:
  name: report-builder
  namespace: k8smissions
  labels:
    app: report-builder
spec:
  containers:
  - name: builder
    image: python:3.12-alpine
    command: ["python", "-m", "http.server", "8080"]
    ports:
    - containerPort: 8080
    readinessProbe:
      httpGet: {path: /, port: 8080}
      periodSeconds: 3
    resources:
      requests:
        cpu: "1500"
        memory: 128Mi
      limits:
        memory: 256Mi

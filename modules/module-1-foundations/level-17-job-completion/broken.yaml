apiVersion: batch/v1
kind: Job
metadata:
  name: nightly-import
  namespace: k8smissions
spec:
  completions: 3
  parallelism: 1
  completionMode: Indexed
  backoffLimit: 2
  activeDeadlineSeconds: 25
  template:
    metadata:
      labels:
        app: nightly-import
    spec:
      restartPolicy: Never
      containers:
      - name: import
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          shard=$((JOB_COMPLETION_INDEX + 1))
          echo "importing shard $shard of 3"
          sleep 12
          echo "shard $shard ok"

apiVersion: v1
kind: LimitRange
metadata:
  name: team-defaults
  namespace: k8smissions
spec:
  limits:
  - type: Container
    maxLimitRequestRatio:
      memory: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-render
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: invoice-render}
  template:
    metadata:
      labels: {app: invoice-render}
    spec:
      containers:
      - name: render
        image: python:3.12-alpine
        command:
        - python
        - -u
        - -c
        - |
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path.startswith("/render"):
                      page = bytearray(b"i") * (360 * 1024 * 1024)
                      body = b"invoice rendered, %d MiB\n" % (len(page) >> 20)
                      del page
                  else:
                      body = b"invoice-render up\n"
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          HTTPServer(("", 8080), H).serve_forever()
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 3
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-render
  namespace: k8smissions
spec:
  selector:
    app: invoice-render
  ports:
  - port: 80
    targetPort: 8080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: blog}
  template:
    metadata:
      labels:
        app: blog
        tier: frontend
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:5678", "-text=Acme blog: latest posts"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: blog
  namespace: k8smissions
spec:
  selector:
    app: blog
    tier: web
  ports:
  - port: 80
    targetPort: 5678

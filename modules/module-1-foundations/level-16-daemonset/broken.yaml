apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: host-audit
  namespace: k8smissions
spec:
  selector:
    matchLabels: {app: host-audit}
  template:
    metadata:
      labels: {app: host-audit}
    spec:
      containers:
      - name: agent
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          while true; do
            echo "audit pass on $NODE_NAME: $(wc -l < /host-etc/passwd) accounts"
            sleep 20
          done
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef: {fieldPath: spec.nodeName}
        volumeMounts:
        - name: host-etc
          mountPath: /host-etc
          readOnly: true
      volumes:
      - name: host-etc
        hostPath:
          path: /etc

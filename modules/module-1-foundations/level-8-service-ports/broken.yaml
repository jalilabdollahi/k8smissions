apiVersion: apps/v1
kind: Deployment
metadata:
  name: thumb-api
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: thumb-api}
  template:
    metadata:
      labels: {app: thumb-api}
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:1.0
        args: ["-listen=:5678", "-text=thumbnailer ready"]
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: thumb-api
  namespace: k8smissions
spec:
  selector:
    app: thumb-api
  ports:
  - port: 80
    targetPort: 80

apiVersion: v1
kind: ConfigMap
metadata:
  name: invoice-render-nginx
  namespace: k8smissions
data:
  default.conf: |
    server {
      listen 8080;
      access_log /var/log/shared/access.log;
      location / { return 200 "invoice-render ok\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-render
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: invoice-render}
  template:
    metadata:
      labels: {app: invoice-render}
    spec:
      containers:
      - name: web
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 3
        volumeMounts:
        - {name: conf, mountPath: /etc/nginx/conf.d}
        - {name: logs, mountPath: /var/log/shared}
      - name: log-tail
        image: busybox:1.36
        command: ["sh", "-c", "touch /logs/access.log; exec tail -F /logs/access.log"]
        volumeMounts:
        - {name: logs, mountPath: /logs}
      volumes:
      - name: conf
        configMap: {name: invoice-render-nginx}
      - name: logs
        emptyDir: {}

apiVersion: v1
kind: Namespace
metadata:
  name: pay-restricted
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-ui
  namespace: pay-restricted
spec:
  replicas: 2
  selector:
    matchLabels: {app: report-ui}
  template:
    metadata:
      labels: {app: report-ui}
    spec:
      initContainers:
      - name: prepare
        image: busybox:1.36
        command: ["sh", "-c", "echo preparing report templates; sleep 1"]
      containers:
      - name: web
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 3

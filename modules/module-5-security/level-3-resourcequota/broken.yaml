apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: k8smissions
spec:
  hard:
    limits.cpu: "2"
    limits.memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-api
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: invoice-api}
  template:
    metadata:
      labels: {app: invoice-api}
    spec:
      containers:
      - name: api
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80

apiVersion: v1
kind: Namespace
metadata:
  name: settle
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settle-config
  namespace: settle
data:
  region: eu-west-1
  batch_window: "15m"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settlement-app
  namespace: settle
data:
  app.py: |
    import json, socket, ssl, sys, urllib.request, urllib.error
    from http.server import BaseHTTPRequestHandler, HTTPServer
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    token = open(SA + "/token").read()
    ns = open(SA + "/namespace").read()
    ctx = ssl.create_default_context(cafile=SA + "/ca.crt")
    req = urllib.request.Request(
        "https://kubernetes.default.svc/api/v1/namespaces/%s/configmaps/settle-config" % ns,
        headers={"Authorization": "Bearer " + token})
    try:
        cfg = json.load(urllib.request.urlopen(req, context=ctx, timeout=5))["data"]
    except urllib.error.HTTPError as e:
        print("cannot load config: HTTP %d %s" % (e.code, json.load(e).get("message")), flush=True)
        sys.exit(1)
    print("config loaded: region=%s" % cfg["region"], flush=True)

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            try:
                socket.create_connection(("settle-db", 5432), timeout=2).close()
                code, body = 200, "ready config=%s db=ok\n" % cfg["region"]
            except OSError as e:
                code, body = 503, "not ready: db unreachable (%s)\n" % e
            self.send_response(code)
            self.end_headers()
            self.wfile.write(body.encode())
        def log_message(self, *a):
            pass
    HTTPServer(("", 8080), H).serve_forever()
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: settlement
  namespace: settle
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: settle-config-reader
  namespace: settle
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["settle-config"]
  verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: settle-config-reader
  namespace: settle
subjects:
- kind: ServiceAccount
  name: settlement
  namespace: settle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: settle-config-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settle-db
  namespace: settle
spec:
  replicas: 1
  selector:
    matchLabels: {app: settle-db}
  template:
    metadata:
      labels: {app: settle-db}
    spec:
      terminationGracePeriodSeconds: 0
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: db
        image: python:3.12-alpine
        command: ["python", "-m", "http.server", "5432", "--directory", "/tmp"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        resources:
          limits: {cpu: 100m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: settle-db
  namespace: settle
spec:
  selector: {app: settle-db}
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Pod
metadata:
  name: rogue
  namespace: settle
  labels: {app: rogue}
spec:
  terminationGracePeriodSeconds: 0
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: sh
    image: busybox:1.36
    command: ["sleep", "86400"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: ["ALL"]}
    resources:
      limits: {cpu: 50m, memory: 64Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-clients
  namespace: settle
spec:
  podSelector:
    matchLabels: {app: settle-db}
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - podSelector:
        matchLabels: {app: settlement-api}
    ports:
    - {port: 5432, protocol: TCP}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: settle-quota
  namespace: settle
spec:
  hard:
    limits.cpu: "2"
    limits.memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: settlement
  namespace: settle
spec:
  selector: {app: settlement}
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement
  namespace: settle
spec:
  replicas: 2
  selector:
    matchLabels: {app: settlement}
  template:
    metadata:
      labels: {app: settlement}
    spec:
      serviceAccountName: settlement
      terminationGracePeriodSeconds: 0
      securityContext:
        runAsUser: 1000
      containers:
      - name: app
        image: python:3.12-alpine
        command: ["python", "-u", "/app/app.py"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 3
        volumeMounts:
        - {name: app, mountPath: /app}
      volumes:
      - name: app
        configMap: {name: settlement-app}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-runner
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: etl-runner}
  template:
    metadata:
      labels: {app: etl-runner}
    spec:
      nodeSelector:
        pool: etl
      containers:
      - name: runner
        image: registry.k8s.io/pause:3.9
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: web-frontend}
  template:
    metadata:
      labels: {app: web-frontend}
    spec:
      containers:
      - name: web
        image: registry.k8s.io/pause:3.9

apiVersion: v1
kind: ConfigMap
metadata:
  name: flags
  namespace: k8smissions
data:
  checkout_v2: "on"
  dark_mode: "off"
  max_cart_items: "40"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flags-reader
  namespace: k8smissions
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flags-reader
  namespace: k8smissions
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["flags"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flags-reader
  namespace: k8smissions
subjects:
- kind: ServiceAccount
  name: flags-reader
  namespace: k8smissions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flags-reader
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-flags-app
  namespace: k8smissions
data:
  app.py: |
    import json, ssl, sys, time, urllib.request, urllib.error
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    try:
        token = open(SA + "/token").read()
        ns = open(SA + "/namespace").read()
    except FileNotFoundError:
        print("no service account token found under " + SA + ", cannot call the API", flush=True)
        sys.exit(1)
    ctx = ssl.create_default_context(cafile=SA + "/ca.crt")
    url = "https://kubernetes.default.svc/api/v1/namespaces/%s/configmaps/flags" % ns
    while True:
        req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
        try:
            data = json.load(urllib.request.urlopen(req, context=ctx, timeout=5))["data"]
        except urllib.error.HTTPError as e:
            print("flag fetch failed: HTTP %d %s" % (e.code, json.load(e).get("message")), flush=True)
            sys.exit(1)
        open("/tmp/ready", "w").write("ok")
        print("flags: " + " ".join("%s=%s" % kv for kv in sorted(data.items())), flush=True)
        time.sleep(5)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-flags
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: feature-flags}
  template:
    metadata:
      labels: {app: feature-flags}
    spec:
      containers:
      - name: app
        image: python:3.12-alpine
        command: ["python", "-u", "/app/app.py"]
        readinessProbe:
          exec: {command: ["test", "-f", "/tmp/ready"]}
          periodSeconds: 3
        volumeMounts:
        - {name: app, mountPath: /app}
      volumes:
      - name: app
        configMap: {name: feature-flags-app}

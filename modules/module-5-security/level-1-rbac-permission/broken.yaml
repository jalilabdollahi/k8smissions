apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-shipper
  namespace: k8smissions
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-reader
  namespace: k8smissions
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-reader
  namespace: k8smissions
subjects:
- kind: ServiceAccount
  name: log-shipper
  namespace: k8smissions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: log-reader
---
apiVersion: v1
kind: Pod
metadata:
  name: orders
  namespace: k8smissions
  labels: {app: orders}
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: orders
    image: busybox:1.36
    command: ["sh", "-c", "i=1000; while true; do echo \"order-$i accepted\"; i=$((i+1)); sleep 2; done"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-shipper-script
  namespace: k8smissions
data:
  ship.sh: |
    #!/bin/sh
    SA=/var/run/secrets/kubernetes.io/serviceaccount
    TOKEN=$(cat $SA/token)
    NS=$(cat $SA/namespace)
    API=https://kubernetes.default.svc
    call() {
      curl -s -o /tmp/body -w '%{http_code}' --cacert $SA/ca.crt \
        -H "Authorization: Bearer $TOKEN" "$API$1"
    }
    code=$(call /api/v1/namespaces/$NS/pods/orders)
    [ "$code" = 200 ] || { echo "cannot find pod orders: HTTP $code $(cat /tmp/body)"; exit 1; }
    echo "pod orders found, shipping its log every 10s"
    while true; do
      code=$(call "/api/v1/namespaces/$NS/pods/orders/log?tailLines=20")
      if [ "$code" != 200 ]; then
        echo "ship failed: HTTP $code $(cat /tmp/body)"
        exit 1
      fi
      cp /tmp/body /data/orders.log
      echo "shipped $(wc -l < /data/orders.log) lines"
      sleep 10
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-shipper
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: log-shipper}
  template:
    metadata:
      labels: {app: log-shipper}
    spec:
      serviceAccountName: log-shipper
      containers:
      - name: shipper
        image: curlimages/curl:8.10.1
        command: ["sh", "/scripts/ship.sh"]
        readinessProbe:
          exec: {command: ["sh", "-c", "test -s /data/orders.log"]}
          periodSeconds: 3
        volumeMounts:
        - {name: scripts, mountPath: /scripts}
        - {name: data, mountPath: /data}
      volumes:
      - name: scripts
        configMap: {name: log-shipper-script}
      - name: data
        emptyDir: {}

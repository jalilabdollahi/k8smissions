apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  namespace: k8smissions
spec:
  replicas: 4
  selector:
    matchLabels: {app: ledger-api}
  template:
    metadata:
      labels: {app: ledger-api}
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
              - {key: data-class, operator: In, values: [restricted]}
      # keep the replicas evenly spread over the nodes they may run on
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels: {app: ledger-api}
      containers:
      - name: api
        image: registry.k8s.io/pause:3.9

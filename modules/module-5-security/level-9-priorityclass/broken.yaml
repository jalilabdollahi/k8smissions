apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      priorityClassName: platform-critical
      terminationGracePeriodSeconds: 0
      containers:
      - name: checkout
        image: registry.k8s.io/pause:3.9
        resources:
          requests: {cpu: 500m}

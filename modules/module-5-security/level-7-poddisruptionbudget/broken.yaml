apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: k8smissions
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: consul
  ports:
  - port: 8500
    name: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consul
  namespace: k8smissions
spec:
  serviceName: consul
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: consul
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consul
        app.kubernetes.io/component: server
    spec:
      terminationGracePeriodSeconds: 0
      containers:
      - name: consul
        image: registry.k8s.io/pause:3.9
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: consul-pdb
  namespace: k8smissions
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: concul

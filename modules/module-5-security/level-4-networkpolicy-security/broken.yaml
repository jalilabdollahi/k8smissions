apiVersion: v1
kind: Pod
metadata:
  name: payments-db
  namespace: k8smissions
  labels: {app: payments-db}
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: db
    image: hashicorp/http-echo:1.0
    args: ["-listen=:8080", "-text=payments-db: ledger ready"]
    ports:
    - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payments-db
  namespace: k8smissions
spec:
  selector: {app: payments-db}
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: payments-api
  namespace: k8smissions
  labels: {app: payments-api}
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: api
    image: curlimages/curl:8.10.1
    command: ["sleep", "86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: batch-exporter
  namespace: k8smissions
  labels: {app: batch-exporter}
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: exporter
    image: curlimages/curl:8.10.1
    command: ["sleep", "86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: debug-shell
  namespace: k8smissions
  labels: {app: debug-shell}
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: shell
    image: curlimages/curl:8.10.1
    command: ["sleep", "86400"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: k8smissions
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-db-from-api
  namespace: k8smissions
spec:
  podSelector:
    matchLabels: {app: payments-db}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {app: payments-api}
    ports:
    - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ns-ingress
  namespace: k8smissions
  annotations:
    note: "added during the 2023 migration, TODO remove"
spec:
  podSelector:
    matchLabels: {app: payments-db}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {}

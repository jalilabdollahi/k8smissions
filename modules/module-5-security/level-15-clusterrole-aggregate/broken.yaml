apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ticket-viewer
aggregationRule:
  clusterRoleSelectors:
  - matchLabels:
      aggregate-to-ticket-viewer: "true"
# the engineer's hand edits: the aggregation controller overwrites them
rules:
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ticket-notes
  labels:
    aggregate-to-ticket-viewer: "true"
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["ticket-notes"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ticket-jobs
  labels:
    aggregate-to-ticket-viewer: "ture"
rules:
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ticket-events
  labels:
    rbac.shop.example/aggregate-to-ticket-viewer: "true"
rules:
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: support-ticket-viewer
subjects:
- kind: Group
  name: support
  apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ticket-viewer

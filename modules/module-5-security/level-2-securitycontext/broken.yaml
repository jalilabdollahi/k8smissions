apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-page
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: status-page}
  template:
    metadata:
      labels: {app: status-page}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        securityContext:
          readOnlyRootFilesystem: true
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: status-page
  namespace: k8smissions
spec:
  selector: {app: status-page}
  ports:
  - port: 80
    targetPort: 80

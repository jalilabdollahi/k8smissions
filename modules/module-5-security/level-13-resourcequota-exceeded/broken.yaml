apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-web
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: catalog-web}
  template:
    metadata:
      labels: {app: catalog-web}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 3

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: api-server}
  template:
    metadata:
      labels: {app: api-server}
    spec:
      containers:
      - name: api
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
          hostPort: 9000
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 2
        lifecycle:
          preStop:
            exec: {command: ["sleep", "4"]}

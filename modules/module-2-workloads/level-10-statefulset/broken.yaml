apiVersion: v1
kind: Service
metadata:
  name: ledger-db
  namespace: k8smissions
spec:
  clusterIP: None
  selector: {app: ledger-db}
  ports:
  - name: peer
    port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-db
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: ledger-db}
  template:
    metadata:
      labels: {app: ledger-db}
    spec:
      containers:
      - name: member
        image: busybox:1.36
        command:
        - sh
        - -c
        - mkdir -p /www && echo "$HOSTNAME" > /www/index.html && exec httpd -f -p 8080 -h /www
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: probe
  namespace: k8smissions
  labels: {app: probe}
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: curl
    image: curlimages/curl:8.10.1
    command: ["sleep", "86400"]

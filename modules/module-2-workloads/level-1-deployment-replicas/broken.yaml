apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: reports}
  template:
    metadata:
      labels: {app: reports}
    spec:
      serviceAccountName: reports-sa
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:5678", "-text=finance dashboard: Q3 revenue"]
        ports:
        - containerPort: 5678
        readinessProbe:
          httpGet: {path: /, port: 5678}
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: reports
  namespace: k8smissions
spec:
  selector: {app: reports}
  ports:
  - port: 80
    targetPort: 5678

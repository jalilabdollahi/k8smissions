apiVersion: apps/v1
kind: Deployment
metadata:
  name: critical-api
  namespace: k8smissions
spec:
  replicas: 4
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: critical-api}
  template:
    metadata:
      labels: {app: critical-api}
      annotations:
        release: "2024.11.0"
    spec:
      containers:
      - name: api
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 2
        lifecycle:
          preStop:
            exec: {command: ["sleep", "4"]}
---
apiVersion: v1
kind: Service
metadata:
  name: critical-api
  namespace: k8smissions
spec:
  selector: {app: critical-api}
  ports:
  - port: 80
    targetPort: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: ledger-api}
  template:
    metadata:
      labels: {app: ledger-api}
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: {app: ledger-api}
      containers:
      - name: api
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 2
        lifecycle:
          preStop:
            exec: {command: ["sleep", "4"]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger-api-pdb
  namespace: k8smissions
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: ledger-api}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-api
  namespace: k8smissions
spec:
  selector: {app: ledger-api}
  ports:
  - port: 80
    targetPort: 80

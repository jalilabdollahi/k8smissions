apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: k8smissions
  annotations:
    kubernetes.io/change-cause: "friday hotfix: pin nginx"
spec:
  replicas: 4
  selector:
    matchLabels: {app: web-app}
  template:
    metadata:
      labels: {app: web-app}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpne # lint: allow-image
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 2

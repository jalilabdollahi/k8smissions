apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: checkout, track: stable}
  template:
    metadata:
      labels: {app: checkout, track: stable}
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:8080", "-text=v2"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: k8smissions
spec:
  selector: {app: checkout}
  ports:
  - port: 80
    targetPort: 8080

apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-app
  namespace: k8smissions
data:
  app.py: |
    import http.server, time
    START = time.time()
    WARM_AFTER = 20
    print("catalog: listening on :8080, warming price cache (20s)", flush=True)
    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            warm = time.time() - START >= WARM_AFTER
            if self.path == "/ready":
                code, body = (200, b"ready\n") if warm else (503, b"cache cold\n")
            else:
                code, body = (200, b"catalog: 1203 products\n") if warm else (503, b"cache cold, try again\n")
            self.send_response(code); self.end_headers(); self.wfile.write(body)
        def log_message(self, *a): pass
    http.server.ThreadingHTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog}
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: app
        image: python:3.12-alpine
        command: ["python", "-u", "/app/app.py"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - {name: app, mountPath: /app}
      volumes:
      - name: app
        configMap: {name: catalog-app}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: k8smissions
spec:
  selector: {app: catalog}
  ports:
  - port: 80
    targetPort: 8080

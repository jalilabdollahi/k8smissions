apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-blue
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: shop, release: blue}
  template:
    metadata:
      labels: {app: shop, release: blue, version: blue}
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:5678", "-text=shop v1 (blue)"]
        ports:
        - containerPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-green
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: shop, release: green}
  template:
    metadata:
      labels: {app: shop, release: green}
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:5678", "-text=shop v2 (green)"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: k8smissions
spec:
  selector:
    app: shop
    version: blue
  ports:
  - port: 80
    targetPort: 5678

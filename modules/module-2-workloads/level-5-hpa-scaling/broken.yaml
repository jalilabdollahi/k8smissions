apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-backend
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: web-backend}
  template:
    metadata:
      labels: {app: web-backend}
    spec:
      containers:
      - name: web
        image: python:3.12-alpine
        command: ["python", "-u", "-c", "import time\nprint('web-backend: serving', flush=True)\nwhile True:\n    sum(i*i for i in range(20000))\n"]
        resources:
          requests: {cpu: 100m, memory: 32Mi}
          limits: {cpu: 250m, memory: 128Mi}
      - name: log-forwarder
        image: busybox:1.36
        command: ["sh", "-c", "while true; do echo forwarding logs; sleep 10; done"]
        resources:
          limits: {memory: 32Mi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-backend
  namespace: k8smissions
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-backend
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50

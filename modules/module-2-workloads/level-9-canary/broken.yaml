apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: app, track: stable}
  template:
    metadata:
      labels: {app: app, track: stable}
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:8080", "-text=stable build 3.1"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-canary
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: app, track: canary}
  template:
    metadata:
      labels: {app: app, track: canary}
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:8080", "-text=canary build 3.2"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: k8smissions
spec:
  selector: {app: app}
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: probe
  namespace: k8smissions
  labels: {app: probe}
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: curl
    image: curlimages/curl:8.10.1
    command: ["sleep", "86400"]

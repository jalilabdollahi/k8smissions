apiVersion: v1
kind: Namespace
metadata:
  name: ci
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-bot
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-manager
  namespace: ci
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-bot-jobs
  namespace: ci
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: job-manager}
subjects:
- {kind: ServiceAccount, name: ci-bot, namespace: ci}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ci-src
  namespace: ci
data:
  ci.py: |
    import json, os, ssl, sys, time, urllib.request, urllib.error
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    MODE = os.environ["MODE"]
    def call(method, path, body=None):
        ctx = ssl.create_default_context(cafile=SA + "/ca.crt")
        req = urllib.request.Request("https://kubernetes.default.svc" + path, method=method,
                                     data=json.dumps(body).encode() if body else None,
                                     headers={"Authorization": "Bearer " + open(SA + "/token").read().strip(), "Content-Type": "application/json"})
        return urllib.request.urlopen(req, context=ctx, timeout=5).status
    def job(name, labels, cpu, command, ttl=None):
        spec = {"backoffLimit": 0, "template": {"metadata": {"labels": labels}, "spec": {"restartPolicy": "Never", "containers": [
            {"name": "run", "image": "busybox:1.36", "command": ["sh", "-c", command], "resources": {"requests": {"cpu": cpu}}}]}}}
        if ttl:
            spec["ttlSecondsAfterFinished"] = int(ttl)
        return {"apiVersion": "batch/v1", "kind": "Job", "metadata": {"name": name, "labels": labels}, "spec": spec}
    def create(j):
        try:
            call("POST", "/apis/batch/v1/namespaces/ci/jobs", j)
            print("created", j["metadata"]["name"], flush=True)
            return True
        except urllib.error.HTTPError as e:
            if e.code == 409:
                return True
            print("create %s failed: HTTP %d %s" % (j["metadata"]["name"], e.code, json.loads(e.read()).get("message", "")), flush=True)
        except Exception as e:
            print("create failed:", e, flush=True)
        return False
    if MODE == "retrier":
        # re-runs the flaky test suite on a schedule
        every, ttl = int(os.environ["RETRY_EVERY"]), os.environ.get("JOB_TTL_SECONDS", "")
        while True:
            create(job("retry-%d" % time.time(), {"kind": "retry", "created-by": "ci-retrier"}, "10m", "echo rerunning flaky-suite; sleep 2", ttl or None))
            time.sleep(every)
    else:
        # the release pipeline: start release-v42 once, retry until the API accepts it
        done = False
        while not done:
            done = create(job("release-v42", {"release": "true"}, "600m", "echo publishing v42; sleep 5"))
            time.sleep(3)
        time.sleep(86400)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: release-v40
  namespace: ci
  labels:
    release: 'true'
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        release: 'true'
    spec:
      restartPolicy: Never
      containers:
      - name: run
        image: busybox:1.36
        command:
        - sh
        - -c
        - echo done
        resources:
          requests:
            cpu: 10m

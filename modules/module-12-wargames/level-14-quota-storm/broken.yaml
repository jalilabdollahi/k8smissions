---
apiVersion: batch/v1
kind: Job
metadata:
  name: flaky-suite
  namespace: ci
  labels: {kind: suite}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {kind: suite}
    spec:
      restartPolicy: Never
      containers:
      - name: run
        image: busybox:1.36
        command: ["sh", "-c", "echo waiting for the integration database; sleep 86400"]
        resources:
          requests: {cpu: 600m}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-quota
  namespace: ci
spec:
  hard:
    count/jobs.batch: "20"
    requests.cpu: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-retrier
  namespace: ci
spec:
  replicas: 1
  selector:
    matchLabels: {app: ci-retrier}
  template:
    metadata:
      labels: {app: ci-retrier}
    spec:
      serviceAccountName: ci-bot
      containers:
      - name: ci
        image: python:3.12-alpine
        command: ["python", "-u", "/src/ci.py"]
        env:
        - {name: MODE, value: retrier}
        - {name: RETRY_EVERY, value: "10"}
        - {name: JOB_TTL_SECONDS, value: ""}
        resources:
          requests: {cpu: 50m}
        volumeMounts:
        - {name: src, mountPath: /src}
      volumes:
      - name: src
        configMap: {name: ci-src}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-driver
  namespace: ci
spec:
  replicas: 1
  selector:
    matchLabels: {app: release-driver}
  template:
    metadata:
      labels: {app: release-driver}
    spec:
      serviceAccountName: ci-bot
      containers:
      - name: ci
        image: python:3.12-alpine
        command: ["python", "-u", "/src/ci.py"]
        env:
        - {name: MODE, value: driver}
        resources:
          requests: {cpu: 50m}
        volumeMounts:
        - {name: src, mountPath: /src}
      volumes:
      - name: src
        configMap: {name: ci-src}

apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: k8smissions
type: Opaque
stringData:
  JWT_SECRET: "k9v-signing-key-2f81b7c4"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: users-seed
  namespace: k8smissions
data:
  users.json: |
    {"42": {"id": 42, "name": "Dana Whitfield", "plan": "business"},
     "7":  {"id": 7,  "name": "Omar Haddad", "plan": "free"}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stack-src
  namespace: k8smissions
data:
  cache.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    USERS = json.load(open("/seed/users.json"))
    class H(BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def reply(self, code, body):
            b = body.encode()
            self.send_response(code); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            if self.path == "/healthz": return self.reply(200, "ok")
            if self.path.startswith("/users/"):
                u = USERS.get(self.path.rsplit("/", 1)[-1])
                return self.reply(200, json.dumps(u)) if u else self.reply(404, "no such user")
            self.reply(404, "not found")
    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
  auth.py: |
    import hmac, hashlib, os, sys, urllib.request, urllib.error
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    path = os.environ.get("SECRET_FILE", "/secrets/jwt-secret")
    try:
        SECRET = open(path).read().strip().encode()
    except OSError as e:
        print("FATAL: cannot read signing key:", e, flush=True)
        sys.exit(1)
    CACHE = os.environ["CACHE_URL"]
    def sign(user): return hmac.new(SECRET, user.encode(), hashlib.sha256).hexdigest()[:32]
    class H(BaseHTTPRequestHandler):
        def log_message(self, fmt, *a): print(self.command, self.path, flush=True)
        def reply(self, code, body):
            b = body.encode()
            self.send_response(code); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_POST(self):
            if self.path.startswith("/login/"):
                u = self.path.rsplit("/", 1)[-1]
                return self.reply(200, u + "." + sign(u))
            self.reply(404, "not found")
        def do_GET(self):
            if self.path in ("/healthz", "/ready"): return self.reply(200, "ok")
            if self.path.startswith("/users/"):
                tok = self.headers.get("Authorization", "").replace("Bearer ", "")
                user, _, sig = tok.partition(".")
                if not user or not hmac.compare_digest(sig, sign(user)):
                    return self.reply(401, "auth: invalid or missing token")
                try:
                    with urllib.request.urlopen(CACHE + self.path, timeout=2) as r:
                        return self.reply(200, r.read().decode())
                except urllib.error.HTTPError as e:
                    return self.reply(e.code, e.read().decode())
                except Exception as e:
                    print("users-cache call failed:", e, flush=True)
                    return self.reply(504, "auth: users-cache did not answer (%s)" % e)
            self.reply(404, "not found")
    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
  gateway.py: |
    import os, urllib.request, urllib.error
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    AUTH = os.environ["AUTH_URL"]
    def call(method, path, headers):
        r = urllib.request.Request(AUTH + path, method=method, headers=headers, data=b"" if method == "POST" else None)
        return urllib.request.urlopen(r, timeout=3)
    class H(BaseHTTPRequestHandler):
        def log_message(self, fmt, *a): print(self.command, self.path, flush=True)
        def reply(self, code, body):
            b = body.encode()
            self.send_response(code); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def forward(self, method, path):
            hdr = {"Authorization": self.headers.get("Authorization", "")}
            try:
                with call(method, path, hdr) as r:
                    return self.reply(r.status, r.read().decode())
            except urllib.error.HTTPError as e:
                return self.reply(e.code, e.read().decode())
            except Exception as e:
                print("auth call failed:", e, flush=True)
                return self.reply(504, "gateway: upstream auth did not answer (%s)\n" % e)
        def do_GET(self):
            if self.path == "/healthz": return self.reply(200, "ok")
            if self.path == "/ready":
                try:
                    call("GET", "/ready", {}).close()
                    return self.reply(200, "ready")
                except Exception as e:
                    return self.reply(503, "not ready: auth unreachable")
            if self.path.startswith("/api/"): return self.forward("GET", self.path[4:])
            self.reply(404, "not found")
        def do_POST(self):
            if self.path.startswith("/login/"): return self.forward("POST", self.path)
            self.reply(404, "not found")
    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-cache
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: users-cache}
  template:
    metadata:
      labels: {app: users-cache}
    spec:
      containers:
      - name: cache
        image: python:3.12-alpine
        command: ["python", "-u", "/src/cache.py"]
        ports:
        - {containerPort: 8080}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 3
        volumeMounts:
        - {name: src, mountPath: /src}
        - {name: seed, mountPath: /seed}
      volumes:
      - name: src
        configMap: {name: stack-src}
      - name: seed
        configMap: {name: users-seed-v2}
---
apiVersion: v1
kind: Service
metadata:
  name: users-cache
  namespace: k8smissions
spec:
  selector: {app: users-cache}
  ports:
  - {port: 80, targetPort: 8081}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: auth}
  template:
    metadata:
      labels: {app: auth}
    spec:
      containers:
      - name: auth
        image: python:3.12-alpine
        command: ["python", "-u", "/src/auth.py"]
        env:
        - {name: CACHE_URL, value: "http://users-cache"}
        ports:
        - {containerPort: 8080}
        readinessProbe:
          httpGet: {path: /ready, port: 8080}
          periodSeconds: 3
        volumeMounts:
        - {name: src, mountPath: /src}
        - {name: secrets, mountPath: /secrets, readOnly: true}
      volumes:
      - name: src
        configMap: {name: stack-src}
      - name: secrets
        secret: {secretName: auth-secrets}
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: k8smissions
spec:
  selector: {app: auth}
  ports:
  - {port: 80, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
      - name: gateway
        image: python:3.12-alpine
        command: ["python", "-u", "/src/gateway.py"]
        env:
        - {name: AUTH_URL, value: "http://auth"}
        ports:
        - {containerPort: 8080}
        readinessProbe:
          httpGet: {path: /ready, port: 8080}
          periodSeconds: 3
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 10
        volumeMounts:
        - {name: src, mountPath: /src}
      volumes:
      - name: src
        configMap: {name: stack-src}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: k8smissions
spec:
  selector: {app: gateway}
  ports:
  - {port: 80, targetPort: 8080}

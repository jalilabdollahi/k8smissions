apiVersion: v1
kind: ConfigMap
metadata:
  name: mtls-src
  namespace: k8smissions
data:
  ledger.py: |
    import socket, ssl
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    def make_ctx():   # certificates are re-read for every connection
        c = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
        c.load_cert_chain("/tls/tls.crt", "/tls/tls.key")
        c.verify_mode = ssl.CERT_REQUIRED
        c.load_verify_locations("/ca/ca.crt")
        return c
    class S(ThreadingHTTPServer):
        def get_request(self):
            sock, addr = super().get_request()
            return make_ctx().wrap_socket(sock, server_side=True, do_handshake_on_connect=False), addr
    class H(BaseHTTPRequestHandler):
        def setup(self):
            self.ok = True
            self.request.settimeout(5)
            try:
                self.request.do_handshake()
            except (ssl.SSLError, OSError) as e:
                self.ok = False
                if "EOF" not in str(e):
                    print("TLS handshake failed:", e, flush=True)
            super().setup()
        def handle(self):
            if self.ok:
                super().handle()
        def finish(self):
            try:
                super().finish()
            except Exception:
                pass
        def log_message(self, fmt, *a): pass
        def do_GET(self):
            if self.path == "/balance":
                peer = self.request.getpeercert().get("subject")
                print("served /balance to", peer, flush=True)
                body = b"ledger balance: 1042.17 EUR\n"
                self.send_response(200); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
            else:
                self.send_response(404); self.send_header("Content-Length", "0"); self.end_headers()
    S(("0.0.0.0", 8443), H).serve_forever()
  gateway.py: |
    import ssl, urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    URL = "https://ledger.k8smissions.svc:8443/balance"
    class H(BaseHTTPRequestHandler):
        def log_message(self, fmt, *a): pass
        def reply(self, code, text):
            b = text.encode()
            self.send_response(code); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            if self.path == "/healthz": return self.reply(200, "ok")
            if self.path == "/balance":
                try:
                    ctx = ssl.create_default_context(cafile="/ca/ca.crt")
                    ctx.load_cert_chain("/client/tls.crt", "/client/tls.key")
                    with urllib.request.urlopen(URL, context=ctx, timeout=4) as r:
                        return self.reply(200, r.read().decode())
                except Exception as e:
                    print("ledger call failed:", e, flush=True)
                    return self.reply(502, "gateway: ledger call failed: %s\n" % e)
            self.reply(404, "not found")
    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: ledger}
  template:
    metadata:
      labels: {app: ledger}
    spec:
      containers:
      - name: ledger
        image: python:3.12-alpine
        command: ["python", "-u", "/src/ledger.py"]
        ports:
        - {containerPort: 8443}
        readinessProbe:
          tcpSocket: {port: 8443}
          periodSeconds: 3
        volumeMounts:
        - {name: src, mountPath: /src}
        - {name: ca, mountPath: /ca}
        - {name: tls, mountPath: /tls/tls.crt, subPath: tls.crt}
        - {name: tls, mountPath: /tls/tls.key, subPath: tls.key}
      volumes:
      - name: src
        configMap: {name: mtls-src}
      - name: ca
        configMap: {name: internal-ca-bundle}
      - name: tls
        secret: {secretName: ledger-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: k8smissions
spec:
  selector: {app: ledger}
  ports:
  - {port: 8443, targetPort: 8443}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
      - name: gateway
        image: python:3.12-alpine
        command: ["python", "-u", "/src/gateway.py"]
        ports:
        - {containerPort: 8080}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 3
        volumeMounts:
        - {name: src, mountPath: /src}
        - {name: ca, mountPath: /ca}
        - {name: client, mountPath: /client, readOnly: true}
      volumes:
      - name: src
        configMap: {name: mtls-src}
      - name: ca
        configMap: {name: internal-ca-bundle}
      - name: client
        secret: {secretName: gateway-client-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: k8smissions
spec:
  selector: {app: gateway}
  ports:
  - {port: 80, targetPort: 8080}

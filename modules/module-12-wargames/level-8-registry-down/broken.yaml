apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: k8smissions
  annotations: {release: "3.2"}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: storefront}
  template:
    metadata:
      labels: {app: storefront}
    spec:
      initContainers:
      - name: schema-check
        image: registry.corp-mirror.invalid/tools/busybox:1.36   # lint: allow-image
        imagePullPolicy: Always
        command: ["sh", "-c", "echo schema check passed"]
      containers:
      - name: storefront
        image: registry.corp-mirror.invalid/shop/http-echo:1.0   # lint: allow-image
        imagePullPolicy: Always
        args: ["-listen=:8080", "-text=storefront 3.2 - spring catalogue"]
        ports:
        - {containerPort: 8080}
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 3
      - name: metrics-sidecar
        image: busybox:1.34.1
        imagePullPolicy: Never
        command: ["sh", "-c", "while true; do echo storefront_up 1; sleep 30; done"]
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: k8smissions
spec:
  selector: {app: storefront}
  ports:
  - {port: 80, targetPort: 8080}

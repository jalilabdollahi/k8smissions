apiVersion: v1
kind: Namespace
metadata:
  name: checkout
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-src
  namespace: checkout
data:
  checkout.py: |
    import os, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    time.sleep(int(os.environ.get("WARMUP_SECONDS", "25")))   # loads the price catalogue before listening
    class H(BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            if self.path != "/healthz":
                t = time.time()
                while time.time() - t < 0.015:      # pricing and tax: about 15 ms of CPU per order
                    pass
            body = ("checkout ok uid=%d\n" % os.getuid()).encode()
            self.send_response(200); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: checkout
spec:
  replicas: 2
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      nodeSelector:
        pool: genral
      containers:
      - name: app
        image: python:3.12-alpine
        command: ["python", "-u", "/src/checkout.py"]
        ports:
        - {containerPort: 8080}
        resources:
          requests: {cpu: 50m, memory: 48Mi}
          limits: {cpu: 200m, memory: 128Mi}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 3
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 2
        volumeMounts:
        - {name: src, mountPath: /src}
      - name: log-shipper
        image: busybox:1.36
        command: ["sh", "-c", "while true; do sleep 30; done"]
        resources:
          requests: {memory: 16Mi}
      volumes:
      - name: src
        configMap: {name: checkout-src}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: checkout
spec:
  selector: {app: checkout}
  ports:
  - {port: 80, targetPort: 8080}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: checkout
  namespace: checkout
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: checkout}
  minReplicas: 2
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: memory
      target: {type: Utilization, averageUtilization: 80}

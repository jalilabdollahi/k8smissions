apiVersion: v1
kind: ConfigMap
metadata:
  name: pressure-src
  namespace: k8smissions
data:
  common.py: |
    import json, os, ssl, time, urllib.request, urllib.error
    NS = open("/var/run/secrets/kubernetes.io/serviceaccount/namespace").read()
    CTX = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
    def api(method, path, body=None, ctype="application/json"):
        tok = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read()
        data = json.dumps(body).encode() if body is not None else None
        r = urllib.request.Request("https://kubernetes.default.svc" + path, data=data, method=method,
                                   headers={"Authorization": "Bearer " + tok, "Content-Type": ctype})
        try:
            with urllib.request.urlopen(r, context=CTX, timeout=30) as resp:
                raw = resp.read()
                return resp.status, json.loads(raw or b"{}"), len(raw)
        except urllib.error.HTTPError as e:
            raw = e.read()
            return e.code, {}, len(raw)
  deploy.py: |
    import base64, os, sys, time
    from common import api, NS
    APP = os.environ["APP"]
    MAX = int(os.environ.get("MAX_REVISIONS", "0"))   # 0 = keep everything
    base = "/api/v1/namespaces/%s/secrets" % NS
    sel = "owner%%3Drelease-deployer,app%%3D%s" % APP
    _, lst, _ = api("GET", base + "?labelSelector=" + sel)
    items = sorted(lst.get("items", []), key=lambda s: int(s["metadata"]["labels"]["revision"]))
    last = int(items[-1]["metadata"]["labels"]["revision"]) if items else 0
    for s in items:
        if s["metadata"]["labels"].get("status") == "deployed":
            api("PATCH", base + "/" + s["metadata"]["name"], {"metadata": {"labels": {"status": "superseded"}}}, "application/merge-patch+json")
    n = last + 1
    name = "sh.release.v1.%s.v%d" % (APP, n)
    code, _, _ = api("POST", base, {"apiVersion": "v1", "kind": "Secret", "metadata": {"name": name,
        "labels": {"owner": "release-deployer", "app": APP, "status": "deployed", "revision": str(n)}},
        "data": {"release": base64.b64encode(b"rendered manifest for %s revision %d" % (APP.encode(), n)).decode()}})
    print("deployed", name, "->", code, flush=True)
    if code >= 300:
        sys.exit(1)
    if MAX > 0:
        items = sorted(items + [{"metadata": {"name": name, "labels": {"revision": str(n)}}}], key=lambda s: int(s["metadata"]["labels"]["revision"]))
        for s in items[:-MAX]:
            print("pruning", s["metadata"]["name"], flush=True)
            api("DELETE", base + "/" + s["metadata"]["name"])
    print("done", flush=True)
  syncer.py: |
    import json, os, threading, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from common import api, NS
    INTERVAL = int(os.environ.get("SYNC_INTERVAL_MS", "250")) / 1000.0
    stats = {"lists": 0, "last_list_ms": 0, "last_bytes": 0, "interval_ms": int(INTERVAL * 1000), "last_ok": False}
    def loop():
        while True:
            t = time.time()
            code, body, size = api("GET", "/api/v1/namespaces/%s/secrets" % NS)
            ms = int((time.time() - t) * 1000)
            stats.update(lists=stats["lists"] + 1, last_list_ms=ms, last_bytes=size, last_ok=code == 200)
            if stats["lists"] % 10 == 1:
                print("synced %d secrets: list took %d ms (%d bytes, HTTP %d)" % (len(body.get("items", [])), ms, size, code), flush=True)
            time.sleep(INTERVAL)
    threading.Thread(target=loop, daemon=True).start()
    class H(BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            b = json.dumps(stats).encode()
            self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: release-deployer
  namespace: k8smissions
spec:
  schedule: "0 4 * * *"
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: release-deployer
          restartPolicy: Never
          containers:
          - name: deploy
            image: python:3.12-alpine
            command: ["python", "-u", "/src/deploy.py"]
            env:
            - {name: APP, value: shop}
            - {name: MAX_REVISIONS, value: "0"}
            - {name: PYTHONPATH, value: /src}
            volumeMounts:
            - {name: src, mountPath: /src}
          volumes:
          - name: src
            configMap: {name: pressure-src}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-syncer
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: config-syncer}
  template:
    metadata:
      labels: {app: config-syncer}
    spec:
      serviceAccountName: config-syncer
      containers:
      - name: syncer
        image: python:3.12-alpine
        command: ["python", "-u", "/src/syncer.py"]
        env:
        - {name: SYNC_INTERVAL_MS, value: "250"}
        - {name: PYTHONPATH, value: /src}
        ports:
        - {containerPort: 8080}
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 3
        volumeMounts:
        - {name: src, mountPath: /src}
      volumes:
      - name: src
        configMap: {name: pressure-src}
---
apiVersion: v1
kind: Service
metadata:
  name: config-syncer
  namespace: k8smissions
spec:
  selector: {app: config-syncer}
  ports:
  - {port: 80, targetPort: 8080}

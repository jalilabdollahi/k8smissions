apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-src
  namespace: k8smissions
data:
  migrate.sh: |
    #!/bin/sh
    # usage: migrate.sh --schema=<version>
    schema="${1#--schema=}"
    case "$schema" in
      v6|v7) ;;
      *) echo "migrate: unknown schema '$schema' (known: v6 v7)"; exit 2;;
    esac
    echo "migrate: applying $schema"
    sleep 2
    echo "$schema" > /data/.migrated
    echo "migrate: done"
  shop.py: |
    import os, socket
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    def schema():
        try:
            return open("/data/.migrated").read().strip()
        except OSError:
            return "unknown"
    class H(BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_GET(self):
            body = ("Winter Sale is open. database schema %s, served by %s\n" % (schema(), socket.gethostname())).encode()
            code = 200 if self.path in ("/", "/healthz") else 404
            self.send_response(code); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shop-data
  namespace: k8smissions
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fast-ssd
  resources:
    requests: {storage: 1Gi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: k8smissions
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: busybox:1.36
        command: ["sh", "/src/migrate.sh", "--schema=v9"]
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: src, mountPath: /src}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: shop-data}
      - name: src
        configMap: {name: shop-src}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: shop-web}
  template:
    metadata:
      labels: {app: shop-web}
    spec:
      serviceAccountName: shop-runner
      initContainers:
      - name: wait-migration
        image: busybox:1.36
        command: ["sh", "-c", "until grep -qx \"$EXPECT_SCHEMA\" /data/.migrated 2>/dev/null; do echo \"waiting for schema $EXPECT_SCHEMA, found: $(cat /data/.migrated 2>/dev/null || echo none)\"; sleep 3; done; echo schema ok"]
        env:
        - {name: EXPECT_SCHEMA, value: v7}
        volumeMounts:
        - {name: data, mountPath: /data, readOnly: true}
      containers:
      - name: web
        image: python:3.12-alpine
        command: ["python", "-u", "/src/shop.py"]
        ports:
        - {containerPort: 8080}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 3
        volumeMounts:
        - {name: data, mountPath: /data, readOnly: true}
        - {name: src, mountPath: /src}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: shop-data}
      - name: src
        configMap: {name: shop-src}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-web
  namespace: k8smissions
spec:
  selector: {app: shop-web}
  ports:
  - {name: web, port: 80, targetPort: 8080}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: k8smissions
  annotations: {deploy/changed: "release 2026.11 ingress retargeting"}
spec:
  ingressClassName: nginx
  rules:
  - host: shop.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: shop-web
            port: {name: http}

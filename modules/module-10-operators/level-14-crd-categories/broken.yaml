apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-engine
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: invoice-engine}
  template:
    metadata:
      labels: {app: invoice-engine}
    spec:
      containers:
      - name: engine
        image: busybox:1.36
        command: ["sh", "-c", "while true; do sleep 30; done"]
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-engine
  namespace: k8smissions
spec:
  selector: {app: invoice-engine}
  ports:
  - {port: 80, targetPort: 8080}

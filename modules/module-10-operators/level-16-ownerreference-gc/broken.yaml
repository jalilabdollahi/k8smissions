apiVersion: v1
kind: Service
metadata:
  name: site-legacy
  namespace: k8smissions
  labels: {site: legacy}
spec:
  selector: {site: legacy}
  ports:
  - {port: 80, targetPort: 8080}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: site-operator
  namespace: k8smissions
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: site-operator
  namespace: k8smissions
rules:
- apiGroups: ["web.acme.io"]
  resources: ["sites"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "create", "patch"]
- apiGroups: [""]
  resources: ["services", "configmaps"]
  verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: site-operator
  namespace: k8smissions
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: site-operator}
subjects:
- {kind: ServiceAccount, name: site-operator, namespace: k8smissions}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: site-operator-code
  namespace: k8smissions
data:
  controller.py: |
    from kapi import api, forever, log, NS

    SITES = "/apis/web.acme.io/v1/namespaces/%s/sites" % NS
    DEPLOYMENTS = "/apis/apps/v1/namespaces/%s/deployments" % NS
    SERVICES = "/api/v1/namespaces/%s/services" % NS
    CONFIGMAPS = "/api/v1/namespaces/%s/configmaps" % NS

    # uid of the Site object this reference was copied from when the operator was written
    OWNER_UID = "6a1c2b9e-2f4d-4c1a-9a53-0c1d6b3e7f10"


    def owner(site):
        return [{"apiVersion": "web.acme.io/v1", "kind": "Site", "name": site["metadata"]["name"],
                 "uid": OWNER_UID, "controller": True}]


    def ensure(base, name, body):
        code, _ = api("GET", "%s/%s" % (base, name))
        if code == 404:
            code, res = api("POST", base, body)
            log("created %s: %s" % (name, code))


    def reconcile():
        code, body = api("GET", SITES)
        if code != 200:
            log("cannot list sites:", code, body.get("message"))
            return
        for site in body["items"]:
            name = site["metadata"]["name"]
            child = "site-" + name
            labels = {"site": name}
            ensure(DEPLOYMENTS, child, {
                "metadata": {"name": child, "labels": labels, "ownerReferences": owner(site)},
                "spec": {"replicas": 1, "selector": {"matchLabels": labels},
                         "template": {"metadata": {"labels": labels}, "spec": {"containers": [
                             {"name": "web", "image": "busybox:1.36", "command": ["sleep", "86400"]}]}}}})
            ensure(SERVICES, child, {
                "metadata": {"name": child, "labels": labels},
                "spec": {"selector": labels, "ports": [{"port": 80, "targetPort": 8080}]}})
            ensure(CONFIGMAPS, child, {
                "metadata": {"name": child, "labels": labels, "ownerReferences": owner(site)},
                "data": {"host": site["spec"]["host"]}})


    forever(reconcile)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-operator
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: site-operator}
  template:
    metadata:
      labels: {app: site-operator}
    spec:
      serviceAccountName: site-operator
      containers:
      - name: operator
        image: python:3.12-alpine
        command: ["python", "-u", "/app/controller.py"]
        env:
        - {name: PYTHONPATH, value: /kapi}
        volumeMounts:
        - {name: app, mountPath: /app}
        - {name: lib, mountPath: /kapi}
      volumes:
      - {name: app, configMap: {name: site-operator-code}}
      - {name: lib, configMap: {name: kapi-lib}}

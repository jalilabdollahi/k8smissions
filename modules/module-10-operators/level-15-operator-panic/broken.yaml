apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-operator
  namespace: k8smissions
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-operator
  namespace: k8smissions
rules:
- apiGroups: ["platform.acme.io"]
  resources: ["workloads"]
  verbs: ["get", "list"]
- apiGroups: ["platform.acme.io"]
  resources: ["workloads/status"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-operator
  namespace: k8smissions
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: workload-operator}
subjects:
- {kind: ServiceAccount, name: workload-operator, namespace: k8smissions}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-operator-code
  namespace: k8smissions
data:
  controller.py: |
    import time
    from kapi import api, patch, log, NS

    LIST = "/apis/platform.acme.io/v1/namespaces/%s/workloads" % NS


    def reconcile():
        code, body = api("GET", LIST)
        workloads = body.get("items")
        for w in workloads:
            name = w["metadata"]["name"]
            options = (w.get("spec") or {}).get("options")
            retries = options["retries"]
            patch("%s/%s/status" % (LIST, name), {"status": {"phase": "Running", "retries": retries}})
            log("reconciled %s (retries=%d)" % (name, retries))


    log("workload-operator starting")
    while True:
        reconcile()
        time.sleep(2)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-operator
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: workload-operator}
  template:
    metadata:
      labels: {app: workload-operator}
    spec:
      serviceAccountName: workload-operator
      containers:
      - name: operator
        image: python:3.12-alpine
        command: ["python", "-u", "/app/controller.py"]
        env:
        - {name: PYTHONPATH, value: /kapi}
        volumeMounts:
        - {name: app, mountPath: /app}
        - {name: lib, mountPath: /kapi}
      volumes:
      - {name: app, configMap: {name: workload-operator-code}}
      - {name: lib, configMap: {name: kapi-lib}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: search-api-script
  namespace: k8smissions
data:
  server.py: |
    import http.server, time

    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.startswith("/search"):
                time.sleep(0.6)  # one query takes 600 ms of work
                body = b"results: 3 hits for your query"
            elif self.path == "/healthz":
                body = b"ok"
            else:
                self.send_response(404)
                self.send_header("Content-Length", "0")
                self.end_headers()
                return
            self.send_response(200)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *a):
            pass

    print("search-api: serving on :8080 (one request at a time)", flush=True)
    http.server.HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: search-api}
  template:
    metadata:
      labels: {app: search-api}
    spec:
      containers:
      - name: api
        image: python:3.12-alpine
        command: ["python", "/app/server.py"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - {name: script, mountPath: /app}
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 2
      volumes:
      - name: script
        configMap: {name: search-api-script}
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: k8smissions
spec:
  selector: {app: search-api}
  ports:
  - {port: 80, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-load
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: search-load}
  template:
    metadata:
      labels: {app: search-load}
    spec:
      containers:
      - name: load
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          for i in 1 2 3; do
            (while true; do wget -q -T 30 -O /dev/null "http://search-api/search?q=boots" || sleep 1; done) &
          done
          wait

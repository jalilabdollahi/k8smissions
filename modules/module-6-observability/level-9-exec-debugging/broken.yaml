apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-api
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: quote-api}
  template:
    metadata:
      labels: {app: quote-api}
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:1.0
        args:
        - -listen=127.0.0.1:5678
        - -text=Quote of the day - ship small, ship often.
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: quote-api
  namespace: k8smissions
spec:
  selector: {app: quote-api}
  ports:
  - {port: 80, targetPort: 5678}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: thumbnailer
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: thumbnailer}
  template:
    metadata:
      labels: {app: thumbnailer}
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        resources:
          requests: {cpu: 50m, memory: 32Mi}
      - name: exporter
        image: busybox:1.36
        command: ["sh", "-c", "echo exporter: rendering stats; while :; do :; done"]
        resources:
          requests: {cpu: 50m, memory: 8Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-cache
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: image-cache}
  template:
    metadata:
      labels: {app: image-cache}
    spec:
      containers:
      - name: cache
        image: nginx:1.27-alpine
        resources:
          requests: {cpu: 20m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-store
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: session-store}
  template:
    metadata:
      labels: {app: session-store}
    spec:
      containers:
      - name: store
        image: busybox:1.36
        command: ["sh", "-c", "while true; do sleep 30; done"]
        resources:
          requests: {cpu: 10m, memory: 8Mi}

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger-data
  namespace: k8smissions
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger-scratch
  namespace: k8smissions
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      terminationGracePeriodSeconds: 3
      containers:
        - name: ledger
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f /data/2025-10-close.csv ]; then
                printf 'account,balance\nAR-1001,48210.55\nAR-1002,1290.00\nAP-2001,-7311.20\ntotal,42189.35\n' > /data/2025-10-close.csv
              fi
              echo "ledger service up, $(wc -l < /data/2025-10-close.csv) lines in the close file"
              while true; do date +%s > /scratch/heartbeat; sleep 5; done
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ledger-data
        - name: scratch
          persistentVolumeClaim:
            claimName: ledger-scratch

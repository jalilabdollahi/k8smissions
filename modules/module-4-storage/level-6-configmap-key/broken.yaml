apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: k8smissions
data:
  app.yaml: |
    listen_port: 8080
    payments_url: http://payments.internal:9000
    feature_flags: [new-checkout, dark-mode]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-src
  namespace: k8smissions
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer

    CONFIG = "/etc/app/app.yaml"

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            try:
                body = open(CONFIG).read()
                code = 200
            except OSError as e:
                body, code = "cannot read %s: %s\n" % (CONFIG, e), 500
            raw = body.encode()
            self.send_response(code)
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)

        def log_message(self, *a):
            pass

    print("web-app serving %s" % CONFIG, flush=True)
    HTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: web
          image: python:3.12-alpine
          command: ["python", "-u", "/src/server.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
          volumeMounts:
            - name: src
              mountPath: /src
            - name: settings
              mountPath: /etc/app
      volumes:
        - name: src
          configMap:
            name: app-src
        - name: settings
          configMap:
            name: app-config
            items:
              - key: settings.yaml
                path: app.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: k8smissions
spec:
  selector:
    app: web-app
  ports:
    - port: 80
      targetPort: 8080

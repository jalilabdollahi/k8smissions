apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-servers
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-servers
  template:
    metadata:
      labels:
        app: web-servers
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: web-servers
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /content
              port: 80
            periodSeconds: 2
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: site-content
---
apiVersion: v1
kind: Service
metadata:
  name: web-servers
  namespace: k8smissions
spec:
  selector:
    app: web-servers
  ports:
    - port: 80
      targetPort: 80

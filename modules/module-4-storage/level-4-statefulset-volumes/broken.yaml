apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata-shared
  namespace: k8smissions
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-cluster
  namespace: k8smissions
spec:
  clusterIP: None
  selector:
    app: postgres-cluster
  ports:
    - port: 5432
      name: pg
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-cluster
  namespace: k8smissions
spec:
  serviceName: postgres-cluster
  replicas: 3
  selector:
    matchLabels:
      app: postgres-cluster
  template:
    metadata:
      labels:
        app: postgres-cluster
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              f=/var/lib/pgdata/node-id
              [ -f "$f" ] || hostname > "$f"
              if [ "$(cat "$f")" != "$(hostname)" ]; then
                echo "FATAL: data directory belongs to $(cat "$f"), refusing to start as $(hostname)"
                exit 1
              fi
              echo "member $(hostname) ready, data directory is mine"
              touch /tmp/ready
              trap 'exit 0' TERM
              while :; do sleep 1; done
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/ready"]
            periodSeconds: 2
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/pgdata
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata-shared

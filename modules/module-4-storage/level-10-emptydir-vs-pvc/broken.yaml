apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-app
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-app
  template:
    metadata:
      labels:
        app: data-app
    spec:
      terminationGracePeriodSeconds: 3
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "/src/app.py"]
          env:
            - name: DATA_DIR
              value: /data
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /status
              port: 8080
            periodSeconds: 2
          volumeMounts:
            - name: src
              mountPath: /src
            - name: uploads
              mountPath: /data
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: src
          configMap:
            name: uploader-src
        - name: uploads
          emptyDir: {}
        - name: scratch
          emptyDir:
            sizeLimit: 200Mi
---
apiVersion: v1
kind: Service
metadata:
  name: data-app
  namespace: k8smissions
spec:
  selector:
    app: data-app
  ports:
    - port: 80
      targetPort: 8080

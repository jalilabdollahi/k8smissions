apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orders-data
  namespace: k8smissions
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-db
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  template:
    metadata:
      labels:
        app: orders-db
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/orders-db
              echo "$(date -u +%FT%TZ) orders-db started" >> /var/lib/orders-db/boot.log
              trap 'exit 0' TERM
              while :; do sleep 1; done
          readinessProbe:
            exec:
              command: ["test", "-f", "/var/lib/orders-db/boot.log"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/orders-db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: orders-db-data

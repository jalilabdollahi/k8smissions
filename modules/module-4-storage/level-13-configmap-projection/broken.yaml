apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: k8smissions
data:
  db.url: "postgres://ledger-db.internal:5432/ledger"
  db.password: ""
  db.pool-size: "20"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: k8smissions
type: Opaque
stringData:
  db.password: "Vx7-casket-2291-orbit"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reader-src
  namespace: k8smissions
data:
  reader.py: |
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    DIR = "/etc/db"

    def read(name):
        try:
            with open(os.path.join(DIR, name)) as f:
                return f.read().strip()
        except OSError:
            return ""

    def check():
        url, pw = read("db.url"), read("db.password")
        print("config check: db.url=%d bytes, db.password=%d bytes" % (len(url), len(pw)), flush=True)
        if not url.startswith("postgres://"):
            return "config=bad reason=db.url"
        if not pw:
            return "config=bad reason=db.password empty"
        return "config=ok"

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            raw = (check() + "\n").encode()
            self.send_response(200)
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)

        def log_message(self, *a):
            pass

    check()
    HTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-reader
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-reader
  template:
    metadata:
      labels:
        app: config-reader
    spec:
      terminationGracePeriodSeconds: 3
      containers:
        - name: reader
          image: python:3.12-alpine
          command: ["python", "-u", "/src/reader.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
          volumeMounts:
            - name: src
              mountPath: /src
            - name: dbconf
              mountPath: /etc/db
              readOnly: true
      volumes:
        - name: src
          configMap:
            name: reader-src
        - name: dbconf
          projected:
            sources:
              - secret:
                  name: db-secret
              - configMap:
                  name: db-config
---
apiVersion: v1
kind: Service
metadata:
  name: config-reader
  namespace: k8smissions
spec:
  selector:
    app: config-reader
  ports:
    - port: 80
      targetPort: 8080

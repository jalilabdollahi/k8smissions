apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: k8smissions
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: web
          image: python:3.12-alpine
          command: ["python", "/src/app.py"]
          env:
            - name: DATA_DIR
              value: /srv/uploads
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /status
              port: 8080
            periodSeconds: 2
          volumeMounts:
            - name: src
              mountPath: /src
            - name: uploads
              mountPath: /var/uploads
      volumes:
        - name: src
          configMap:
            name: uploader-src
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: k8smissions
spec:
  selector:
    app: web-app
  ports:
    - port: 80
      targetPort: 8080

apiVersion: v1
kind: Secret
metadata:
  name: signing-keys
  namespace: k8smissions
type: Opaque
stringData:
  signing.key: "k8s-invoice-signing-key-7f3a9c1e5b"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: writer-src
  namespace: k8smissions
data:
  writer.py: |
    import hashlib
    import hmac
    import os
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    KEY = "/etc/signing/signing.key"
    SPOOL = "/spool/last.sig"
    state = {"signed": "no"}

    def sign_once():
        mode = os.stat(KEY).st_mode & 0o777
        if mode & 0o007:
            # like ssh: a private key readable by everyone is refused
            raise SystemExit("refusing to use %s: mode %o is readable by others" % (KEY, mode))
        key = open(KEY, "rb").read()
        sig = hmac.new(key, b"invoice-batch-0007", hashlib.sha256).hexdigest()
        with open(SPOOL, "w") as f:
            f.write(sig + "\n")
        state["signed"] = "ok"

    sign_once()  # a failure here ends the process, as in the real service

    def loop():
        while True:
            time.sleep(5)
            try:
                sign_once()
            except Exception as e:
                state["signed"] = "no"
                print("signing failed: %s" % e, flush=True)

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            raw = ("signed=%s uid=%d\n" % (state["signed"], os.getuid())).encode()
            self.send_response(200)
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)

        def log_message(self, *a):
            pass

    threading.Thread(target=loop, daemon=True).start()
    print("writer-app signing as uid %d" % os.getuid(), flush=True)
    HTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer-app
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: writer-app
  template:
    metadata:
      labels:
        app: writer-app
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: writer
          image: python:3.12-alpine
          command: ["python", "-u", "/src/writer.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
          volumeMounts:
            - name: src
              mountPath: /src
            - name: keys
              mountPath: /etc/signing
              readOnly: true
            - name: spool
              mountPath: /spool
      volumes:
        - name: src
          configMap:
            name: writer-src
        - name: keys
          secret:
            secretName: signing-keys
            defaultMode: 0400
        - name: spool
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: writer-app
  namespace: k8smissions
spec:
  selector:
    app: writer-app
  ports:
    - port: 80
      targetPort: 8080

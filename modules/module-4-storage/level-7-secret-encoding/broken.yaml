apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: k8smissions
type: Opaque
data:
  username: bGVkZ2Vy
  password: TGVkZzNyLTlmUTJ4Cg==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-client-src
  namespace: k8smissions
data:
  client.py: |
    import hashlib
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    # What the database server accepts (it stores only a hash of the password).
    DB_USER = b"ledger"
    DB_HASH = hashlib.sha256(b"Ledg3r-9fQ2x").hexdigest()
    state = {"auth": "unknown"}

    def login_loop():
        last = None
        while True:
            try:
                user = open("/etc/db/username", "rb").read()
                password = open("/etc/db/password", "rb").read()
                good = user == DB_USER and hashlib.sha256(password).hexdigest() == DB_HASH
            except OSError as e:
                good = False
                print("cannot read credentials: %s" % e, flush=True)
            state["auth"] = "ok" if good else "failed"
            if state["auth"] != last:
                print("auth %s for user ledger" % state["auth"], flush=True)
                last = state["auth"]
            time.sleep(2)

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            raw = ("auth=%s\n" % state["auth"]).encode()
            self.send_response(200)
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)

        def log_message(self, *a):
            pass

    threading.Thread(target=login_loop, daemon=True).start()
    HTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-client
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-client
  template:
    metadata:
      labels:
        app: db-client
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: client
          image: python:3.12-alpine
          command: ["python", "-u", "/src/client.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
          volumeMounts:
            - name: src
              mountPath: /src
            - name: db
              mountPath: /etc/db
              readOnly: true
      volumes:
        - name: src
          configMap:
            name: db-client-src
        - name: db
          secret:
            secretName: db-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: db-client
  namespace: k8smissions
spec:
  selector:
    app: db-client
  ports:
    - port: 80
      targetPort: 8080

apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: k8smissions
spec:
  hard:
    requests.cpu: 1500m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-web
  namespace: k8smissions
spec:
  replicas: 4
  selector:
    matchLabels:
      app: payments-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: payments-web
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 2
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "3"]
        resources:
          requests: {cpu: 280m, memory: 16Mi}
          limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: payments-web
  namespace: k8smissions
spec:
  selector:
    app: payments-web
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-reprocess
  namespace: k8smissions
  annotations:
    owner: "data-platform (replays failed settlements on request, idle since the last quarter close)"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch-reprocess
  template:
    metadata:
      labels:
        app: batch-reprocess
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "while true; do sleep 30; done"]
        resources:
          requests: {cpu: 250m, memory: 16Mi}
          limits: {memory: 32Mi}

apiVersion: v1
kind: ConfigMap
metadata:
  name: invoice-render-app
  namespace: k8smissions
data:
  app.py: |
    import http.server, random, time

    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.startswith("/hang"):
                time.sleep(3600)                      # a stuck backend: never answers
            elif self.path.startswith("/render"):
                time.sleep(random.uniform(6, 9))      # building the PDF
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(b"%PDF-1.7 invoice\n")
        def log_message(self, *a):
            pass

    http.server.ThreadingHTTPServer(("127.0.0.1", 9000), H).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: k8smissions
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: ingress
        address:
          socket_address: {address: 0.0.0.0, port_value: 8080}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              route_config:
                name: local
                virtual_hosts:
                - name: invoice
                  domains: ["*"]
                  routes:
                  - match: {prefix: "/"}
                    route:
                      cluster: app
                      timeout: 3s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: app
        type: STATIC
        connect_timeout: 1s
        load_assignment:
          cluster_name: app
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: {address: 127.0.0.1, port_value: 9000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-render
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoice-render
  template:
    metadata:
      labels:
        app: invoice-render
    spec:
      terminationGracePeriodSeconds: 3
      containers:
      - name: app
        image: python:3.12-alpine
        command: ["python", "-u", "/app/app.py"]
        volumeMounts:
        - name: app
          mountPath: /app
      - name: envoy
        image: envoyproxy/envoy:v1.31.2
        args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
        ports:
        - containerPort: 8080
        - containerPort: 9901
        readinessProbe:
          httpGet:
            path: /ready
            port: 9901
          periodSeconds: 2
        volumeMounts:
        - name: envoy
          mountPath: /etc/envoy
      volumes:
      - name: app
        configMap:
          name: invoice-render-app
      - name: envoy
        configMap:
          name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-render
  namespace: k8smissions
spec:
  selector:
    app: invoice-render
  ports:
  - {name: http, port: 80, targetPort: 8080}
  - {name: admin, port: 9901, targetPort: 9901}
---
apiVersion: v1
kind: Pod
metadata:
  name: invoice-client
  namespace: k8smissions
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: client
    image: python:3.12-alpine
    command: ["python", "-u", "-c"]
    args:
    - |
      import time, urllib.request, urllib.error
      while True:
          t = time.time()
          try:
              code = urllib.request.urlopen("http://invoice-render/render", timeout=30).status
          except urllib.error.HTTPError as e:
              code = e.code
          except Exception as e:
              code = repr(e)
          print("GET /render -> %s in %.1fs" % (code, time.time() - t), flush=True)
          time.sleep(2)

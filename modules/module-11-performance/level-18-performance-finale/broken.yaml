apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-dns-corefile
  namespace: k8smissions
data:
  Corefile: |
    catalog.internal:53 {
        log
        hosts {
            10.96.150.119 pricing.catalog.internal
        }
    }
    .:53 {
        log
        template ANY ANY {
            rcode NXDOMAIN
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-dns
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-dns
  template:
    metadata:
      labels:
        app: catalog-dns
    spec:
      containers:
      - name: coredns
        image: registry.k8s.io/coredns/coredns:v1.14.2
        args: ["-conf", "/etc/coredns/Corefile"]
        ports:
        - {containerPort: 53, protocol: UDP}
        - {containerPort: 53, protocol: TCP}
        volumeMounts:
        - name: conf
          mountPath: /etc/coredns
      volumes:
      - name: conf
        configMap:
          name: catalog-dns-corefile
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-dns
  namespace: k8smissions
spec:
  clusterIP: 10.96.150.118
  selector:
    app: catalog-dns
  ports:
  - {name: dns, port: 53, protocol: UDP}
  - {name: dns-tcp, port: 53, protocol: TCP}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-apps
  namespace: k8smissions
data:
  pricing.py: |
    import http.server, json, os, time

    COST_MS = 20                  # CPU spent pricing one page
    served = [0]

    def burn(ms):
        end = time.thread_time() + ms / 1000.0
        while time.thread_time() < end:
            pass

    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/stats":
                body = json.dumps({"requests": served[0], "pod": os.environ.get("HOSTNAME")}).encode()
            else:
                burn(COST_MS)
                served[0] += 1
                body = b'{"price": 41.17}'
            self.send_response(200)
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *a):
            pass

    http.server.ThreadingHTTPServer(("", 8080), H).serve_forever()
  storefront.py: |
    import http.server, json, os, socket, urllib.request

    HOST = os.environ["PRICING_HOST"]
    calls = [0]

    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/stats":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(json.dumps({"calls": calls[0]}).encode())
                return
            try:
                ip = socket.getaddrinfo(HOST, 8080, socket.AF_INET)[0][4][0]       # service discovery on every page
                body = urllib.request.urlopen("http://%s:8080/price" % ip, timeout=2.5).read()
                calls[0] += 1
                self.send_response(200)
            except Exception:
                body = b"pricing unavailable"
                self.send_response(502)
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *a):
            pass

    http.server.ThreadingHTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pricing
  template:
    metadata:
      labels:
        app: pricing
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: pricing
        image: python:3.12-alpine
        command: ["python", "-u", "/app/pricing.py"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /stats, port: 8080}
          periodSeconds: 3
        resources:
          requests: {cpu: 100m, memory: 24Mi}
          limits: {cpu: 100m, memory: 64Mi}
        volumeMounts:
        - name: app
          mountPath: /app
      volumes:
      - name: app
        configMap:
          name: shop-apps
---
apiVersion: v1
kind: Service
metadata:
  name: pricing
  namespace: k8smissions
spec:
  clusterIP: 10.96.150.119
  sessionAffinity: ClientIP
  selector:
    app: pricing
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      terminationGracePeriodSeconds: 5
      dnsPolicy: None
      dnsConfig:
        nameservers: ["10.96.150.118"]
        searches: ["k8smissions.svc.cluster.local", "svc.cluster.local", "cluster.local"]
        options:
        - {name: ndots, value: "5"}
      containers:
      - name: storefront
        image: python:3.12-alpine
        command: ["python", "-u", "/app/storefront.py"]
        env:
        - {name: PRICING_HOST, value: pricing.catalog.internal}
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /stats, port: 8080}
          periodSeconds: 3
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {memory: 96Mi}
        volumeMounts:
        - name: app
          mountPath: /app
      volumes:
      - name: app
        configMap:
          name: shop-apps
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: k8smissions
spec:
  selector:
    app: storefront
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: page-client
  namespace: k8smissions
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: client
    image: python:3.12-alpine
    command: ["python", "-u", "-c"]
    args:
    - |
      import threading, time, urllib.request

      lat, lock = [], threading.Lock()

      def run():
          while True:
              t = time.time()
              try:
                  urllib.request.urlopen("http://storefront/page", timeout=3).read()
                  ok = True
              except Exception:
                  ok = False
              with lock:
                  lat.append(((time.time() - t) * 1000, ok))
              time.sleep(max(0, 0.8 - (time.time() - t)))      # about 4 page views per second

      for _ in range(3):
          threading.Thread(target=run, daemon=True).start()
      while True:
          time.sleep(10)
          with lock:
              rows, lat[:] = sorted(lat), []
          if rows:
              print("page views: %d  failed: %d  p95: %d ms" % (
                  len(rows), sum(1 for r in rows if not r[1]), rows[int(len(rows) * 0.95)][0]), flush=True)

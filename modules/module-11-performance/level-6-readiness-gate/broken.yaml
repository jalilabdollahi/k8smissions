apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-web-app
  namespace: k8smissions
data:
  app.py: |
    import http.server, os, signal, threading, time

    WARM_AFTER = int(os.environ.get("WARM_AFTER", "6"))   # seconds to fill the cache
    started = time.time()

    def warm():
        return time.time() - started >= WARM_AFTER

    # keep serving for 5s after SIGTERM so endpoint removal can catch up
    signal.signal(signal.SIGTERM, lambda *a: threading.Timer(5, os._exit, [0]).start())

    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                code, body = 200, "alive"
            elif self.path == "/warm":
                code, body = (200, "warm") if warm() else (503, "cold")
            else:
                code, body = (200, "catalog page") if warm() else (503, "cache is cold")
            self.send_response(code)
            self.end_headers()
            self.wfile.write(body.encode())
        def log_message(self, *a):
            pass

    http.server.ThreadingHTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-web
  namespace: k8smissions
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: catalog-web
  template:
    metadata:
      labels:
        app: catalog-web
    spec:
      terminationGracePeriodSeconds: 10
      readinessGates:
      - conditionType: catalog.k8smissions.io/warm
      containers:
      - name: web
        image: python:3.12-alpine
        command: ["python", "-u", "/app/app.py"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 2
        volumeMounts:
        - name: app
          mountPath: /app
      volumes:
      - name: app
        configMap:
          name: catalog-web-app
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-web
  namespace: k8smissions
spec:
  selector:
    app: catalog-web
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: warmup-gate
  namespace: k8smissions
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: warmup-gate
  namespace: k8smissions
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: warmup-gate
  namespace: k8smissions
subjects:
- kind: ServiceAccount
  name: warmup-gate
  namespace: k8smissions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: warmup-gate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: warmup-gate-script
  namespace: k8smissions
data:
  gate.py: |
    import json, os, ssl, time, urllib.request

    COND = os.environ["CONDITION_TYPE"]
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    NS = open(SA + "/namespace").read()
    CTX = ssl.create_default_context(cafile=SA + "/ca.crt")
    API = "https://kubernetes.default.svc"

    def call(method, path, body=None, ctype="application/json"):
        req = urllib.request.Request(
            API + path, method=method,
            data=json.dumps(body).encode() if body is not None else None,
            headers={"Authorization": "Bearer " + open(SA + "/token").read(), "Content-Type": ctype})
        return json.load(urllib.request.urlopen(req, context=CTX, timeout=5))

    def is_warm(ip):
        try:
            return urllib.request.urlopen("http://%s:8080/warm" % ip, timeout=2).status == 200
        except Exception:
            return False

    print("warmup-gate: managing condition %s" % COND, flush=True)
    while True:
        try:
            pods = call("GET", "/api/v1/namespaces/%s/pods?labelSelector=app%%3Dcatalog-web" % NS)["items"]
            for p in pods:
                ip = p["status"].get("podIP")
                if not ip or p["metadata"].get("deletionTimestamp"):
                    continue
                want = "True" if is_warm(ip) else "False"
                cur = [c for c in p["status"].get("conditions", []) if c["type"] == COND]
                if cur and cur[0]["status"] == want:
                    continue
                cond = {"type": COND, "status": want,
                        "lastTransitionTime": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
                call("PATCH", "/api/v1/namespaces/%s/pods/%s/status" % (NS, p["metadata"]["name"]),
                     {"status": {"conditions": [cond]}}, "application/strategic-merge-patch+json")
                print("%s=%s on %s" % (COND, want, p["metadata"]["name"]), flush=True)
        except Exception as e:
            print("error: %s" % e, flush=True)
        time.sleep(1)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warmup-gate
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: warmup-gate
  template:
    metadata:
      labels:
        app: warmup-gate
    spec:
      serviceAccountName: warmup-gate
      terminationGracePeriodSeconds: 1
      containers:
      - name: gate
        image: python:3.12-alpine
        command: ["python", "-u", "/app/gate.py"]
        env:
        - name: CONDITION_TYPE
          value: catalog.k8smissions.io/warmed
        volumeMounts:
        - name: app
          mountPath: /app
      volumes:
      - name: app
        configMap:
          name: warmup-gate-script

apiVersion: v1
kind: ConfigMap
metadata:
  name: transcoder-app
  namespace: k8smissions
data:
  collector.py: |
    import http.server, json, urllib.parse

    state = {"started": [], "done": [], "bye": []}

    class H(http.server.BaseHTTPRequestHandler):
        def reply(self, obj):
            body = json.dumps(obj).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(body)
        def do_POST(self):
            u = urllib.parse.urlparse(self.path)
            q = urllib.parse.parse_qs(u.query)
            kind = u.path.strip("/")
            if kind in state:
                state[kind].append(q.get("id", [""])[0])
            self.reply({"ok": True})
        def do_GET(self):
            self.reply(state)
        def log_message(self, *a):
            pass

    http.server.ThreadingHTTPServer(("", 8081), H).serve_forever()
  worker.py: |
    import http.server, os, signal, threading, time, urllib.parse, urllib.request

    ME = os.environ.get("HOSTNAME", "worker")
    active = [0]
    draining = threading.Event()

    def tell(kind, ident):
        try:
            urllib.request.urlopen(urllib.request.Request(
                "http://result-collector:8081/%s?id=%s" % (kind, ident), method="POST"), timeout=3).read()
        except Exception as e:
            print("collector unreachable:", e, flush=True)

    def transcode(ident, secs):
        time.sleep(secs)
        tell("done", ident)
        active[0] -= 1
        print("finished", ident, flush=True)

    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            u = urllib.parse.urlparse(self.path)
            q = urllib.parse.parse_qs(u.query)
            if u.path == "/submit":
                ident, secs = q["id"][0], float(q.get("secs", ["20"])[0])
                active[0] += 1
                tell("started", ident)
                threading.Thread(target=transcode, args=(ident, secs), daemon=True).start()
                self.send_response(202)
            else:
                self.send_response(200)
            self.end_headers()
            self.wfile.write(ME.encode())
        def log_message(self, *a):
            pass

    def on_term(*_):
        print("SIGTERM: draining, %d job(s) running" % active[0], flush=True)
        draining.set()

    signal.signal(signal.SIGTERM, on_term)
    threading.Thread(target=http.server.ThreadingHTTPServer(("", 8080), H).serve_forever, daemon=True).start()
    print("transcoder ready", flush=True)
    while not (draining.is_set() and active[0] == 0):
        time.sleep(0.2)
    tell("bye", ME)
    print("clean shutdown", flush=True)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-collector
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result-collector
  template:
    metadata:
      labels:
        app: result-collector
    spec:
      containers:
      - name: collector
        image: python:3.12-alpine
        command: ["python", "-u", "/app/collector.py"]
        ports:
        - containerPort: 8081
        readinessProbe:
          httpGet: {path: /, port: 8081}
          periodSeconds: 2
        volumeMounts:
        - name: app
          mountPath: /app
      volumes:
      - name: app
        configMap:
          name: transcoder-app
---
apiVersion: v1
kind: Service
metadata:
  name: result-collector
  namespace: k8smissions
spec:
  selector:
    app: result-collector
  ports:
  - port: 8081
    targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-transcoder
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels:
      app: video-transcoder
  template:
    metadata:
      labels:
        app: video-transcoder
    spec:
      terminationGracePeriodSeconds: 15
      containers:
      - name: worker
        image: python:3.12-alpine
        command: ["sh", "-c", "echo 'starting transcoder'; python -u /app/worker.py; echo \"transcoder exited with $?\""]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 2
        volumeMounts:
        - name: app
          mountPath: /app
      volumes:
      - name: app
        configMap:
          name: transcoder-app
---
apiVersion: v1
kind: Service
metadata:
  name: video-transcoder
  namespace: k8smissions
spec:
  selector:
    app: video-transcoder
  ports:
  - port: 80
    targetPort: 8080

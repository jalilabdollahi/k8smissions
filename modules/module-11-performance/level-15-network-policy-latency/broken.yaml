apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-dns
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-dns
  template:
    metadata:
      labels:
        app: catalog-dns
    spec:
      containers:
      - name: coredns
        image: registry.k8s.io/coredns/coredns:v1.14.2
        args: ["-conf", "/etc/coredns/Corefile"]
        ports:
        - {containerPort: 53, protocol: UDP}
        - {containerPort: 53, protocol: TCP}
        volumeMounts:
        - name: conf
          mountPath: /etc/coredns
      volumes:
      - name: conf
        configMap:
          name: catalog-dns-corefile
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-dns
  namespace: k8smissions
spec:
  clusterIP: 10.96.150.115
  selector:
    app: catalog-dns
  ports:
  - {name: dns, port: 53, protocol: UDP}
  - {name: dns-tcp, port: 53, protocol: TCP}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: price-feed-app
  namespace: k8smissions
data:
  feed.py: |
    import socket, time

    NAMES = ["quotes.catalog.internal.", "currency.catalog.internal.", "sku-history.catalog.internal."]

    while True:
        for name in NAMES:
            t = time.time()
            try:
                n = len({a[4][0] for a in socket.getaddrinfo(name, None, socket.AF_INET)})
                print("lookup %-32s ok     %5d ms  %d addresses" % (name, (time.time() - t) * 1000, n), flush=True)
            except Exception as e:
                print("lookup %-32s FAILED %5d ms  %s" % (name, (time.time() - t) * 1000, e), flush=True)
            time.sleep(0.5)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-feed
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels:
      app: price-feed
  template:
    metadata:
      labels:
        app: price-feed
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers: ["10.96.150.115"]
        options:
        - {name: ndots, value: "1"}
      containers:
      - name: feed
        image: python:3.12-alpine
        command: ["python", "-u", "/app/feed.py"]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
        volumeMounts:
        - name: app
          mountPath: /app
      volumes:
      - name: app
        configMap:
          name: price-feed-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-sink
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-sink
  template:
    metadata:
      labels:
        app: ledger-sink
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: sink
        image: python:3.12-alpine
        command: ["python", "-m", "http.server", "8080"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 3
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: price-feed-egress
  namespace: k8smissions
spec:
  podSelector:
    matchLabels:
      app: price-feed
  policyTypes: ["Egress"]
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: catalog-dns
    ports:
    - {protocol: UDP, port: 53}

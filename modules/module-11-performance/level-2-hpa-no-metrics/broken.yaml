apiVersion: v1
kind: ConfigMap
metadata:
  name: thumbnailer-app
  namespace: k8smissions
data:
  app.py: |
    import http.server, time

    COST_MS = 30            # CPU spent on one thumbnail

    def burn(ms):
        end = time.thread_time() + ms / 1000.0
        while time.thread_time() < end:
            pass

    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.startswith("/resize"):
                burn(COST_MS)
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"thumb")
        def log_message(self, *a):
            pass

    http.server.ThreadingHTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thumbnailer
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thumbnailer
  template:
    metadata:
      labels:
        app: thumbnailer
    spec:
      containers:
      - name: resizer
        image: python:3.12-alpine
        command: ["python", "-u", "/app/app.py"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 48Mi
        volumeMounts:
        - name: app
          mountPath: /app
      - name: log-shipper
        image: busybox:1.36
        command: ["sh", "-c", "while true; do echo shipped >/dev/null; sleep 20; done"]
      volumes:
      - name: app
        configMap:
          name: thumbnailer-app
---
apiVersion: v1
kind: Service
metadata:
  name: thumbnailer
  namespace: k8smissions
spec:
  selector:
    app: thumbnailer
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: thumbnailer
  namespace: k8smissions
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: thumbnailer
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
---
apiVersion: v1
kind: Pod
metadata:
  name: queue-feeder
  namespace: k8smissions
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: feeder
    image: python:3.12-alpine
    command: ["python", "-u", "-c"]
    args:
    - |
      import threading, time, urllib.request

      def feed():
          while True:
              t = time.time()
              try:
                  urllib.request.urlopen("http://thumbnailer/resize", timeout=5).read()
              except Exception:
                  pass
              time.sleep(max(0, 0.33 - (time.time() - t)))     # about 3 requests/s per thread

      for _ in range(4):
          threading.Thread(target=feed, daemon=True).start()
      while True:
          time.sleep(3600)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-page
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: status-page}
  template:
    metadata:
      labels: {app: status-page}
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:5678", "-text=status: all systems operational"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: status-page
  namespace: k8smissions
spec:
  type: NodePort
  selector:
    app: status-page
  ports:
  - port: 80
    targetPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-status
  namespace: k8smissions
  labels:
    decommissioned: "true"
spec:
  type: NodePort
  selector:
    app: legacy-status
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080

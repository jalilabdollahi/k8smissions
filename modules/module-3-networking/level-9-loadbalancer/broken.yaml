apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: storefront}
  template:
    metadata:
      labels: {app: storefront}
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:5678", "-text=storefront: partner portal"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-lb
  namespace: k8smissions
spec:
  type: LoadBalancer
  loadBalancerClass: example.com/internal-lb
  allocateLoadBalancerNodePorts: false
  selector:
    app: storefront
  ports:
  - port: 80
    targetPort: 5678

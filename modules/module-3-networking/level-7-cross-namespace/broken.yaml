apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: warehouse
spec:
  replicas: 2
  selector:
    matchLabels: {app: inventory}
  template:
    metadata:
      labels: {app: inventory}
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:1.0
        args: ["-listen=:8080", "-text=inventory: 1840 skus"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: warehouse
spec:
  selector:
    app: inventory
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: only-storefront-team
  namespace: warehouse
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {team: storefront}
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: outsider
  namespace: contractors
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: curl
    image: curlimages/curl:8.10.1
    command: ["sleep", "86400"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-code
  namespace: k8smissions
data:
  storefront.py: |
    import os, urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            url = os.environ["INVENTORY_URL"]
            try:
                urllib.request.urlopen(url, timeout=2).read()
                state = "ok"
            except OSError:
                state = "unreachable"
            self.send_response(200)
            self.end_headers()
            self.wfile.write(("upstream: " + state + "\n").encode())
        def log_message(self, *a):
            pass

    HTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: storefront}
  template:
    metadata:
      labels: {app: storefront}
    spec:
      containers:
      - name: storefront
        image: python:3.12-alpine
        command: ["python", "-u", "/app/storefront.py"]
        env:
        - name: INVENTORY_URL
          value: http://inventory:8080
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket: {port: 8080}
        volumeMounts:
        - {name: code, mountPath: /app}
      volumes:
      - name: code
        configMap: {name: storefront-code}

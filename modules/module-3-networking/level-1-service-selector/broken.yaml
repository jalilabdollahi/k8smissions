apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: cart, tier: web}
  template:
    metadata:
      labels: {app: cart, tier: web}
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:5678", "-text=storefront: cart page"]
        ports:
        - containerPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-loadtest
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: cart, tier: load}
  template:
    metadata:
      labels: {app: cart, tier: load}
    spec:
      containers:
      - name: stub
        image: hashicorp/http-echo:1.0
        args: ["-listen=:5678", "-text=load-test OK"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: k8smissions
spec:
  selector:
    app: cart
  ports:
  - port: 80
    targetPort: 5678

apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
      annotations:
        kubernetes.io/change-cause: "release 4.2"
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:8080", "-text=checkout v4.2"]
        ports:
        - name: app-http
          containerPort: 8080
        readinessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: k8smissions
spec:
  selector:
    app: checkout
  ports:
  - name: web
    port: 80
    targetPort: http

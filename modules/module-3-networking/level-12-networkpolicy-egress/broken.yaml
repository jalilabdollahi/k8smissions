apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: invoice-code
  namespace: payments
data:
  invoice.py: |
    import socket, urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    def dns_ok():
        try:
            socket.getaddrinfo("ledger-db", 8080)
            return True
        except OSError as e:
            print("bad address 'ledger-db':", e, flush=True)
            return False

    def db_ok():
        try:
            body = urllib.request.urlopen("http://ledger-db:8080/", timeout=3).read().decode()
            return body.startswith("ledger-db")
        except Exception as e:
            print("ledger-db call failed:", e, flush=True)
            return False

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            d = dns_ok()
            b = db_ok() if d else False
            out = "dns=%s db=%s\n" % ("ok" if d else "fail", "ok" if b else "fail")
            self.send_response(200)
            self.end_headers()
            self.wfile.write(out.encode())

        def log_message(self, *a):
            pass

    HTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels: {app: invoice}
  template:
    metadata:
      labels: {app: invoice}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
      - name: invoice
        image: python:3.12-alpine
        command: ["python", "-u", "/app/invoice.py"]
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 3
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        configMap:
          name: invoice-code
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-db
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels: {app: ledger-db}
  template:
    metadata:
      labels: {app: ledger-db}
    spec:
      containers:
      - name: db
        image: hashicorp/http-echo:1.0
        args: ["-listen=:8080", "-text=ledger-db: 42 open invoices"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-db
  namespace: payments
spec:
  selector:
    app: ledger-db
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-log
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels: {app: audit-log}
  template:
    metadata:
      labels: {app: audit-log}
    spec:
      containers:
      - name: log
        image: hashicorp/http-echo:1.0
        args: ["-listen=:8080", "-text=audit-log: not for invoice"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: audit-log
  namespace: payments
spec:
  selector:
    app: audit-log
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: payments
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db
  namespace: payments
spec:
  podSelector:
    matchLabels: {app: invoice}
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector:
        matchLabels: {role: db}
    ports:
    - protocol: TCP
      port: 8080

apiVersion: v1
kind: ConfigMap
metadata:
  name: reporter-code
  namespace: k8smissions
data:
  reporter.py: |
    import socket, threading, urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    def check():
        try:
            socket.gethostbyname("ledger-db")
        except OSError:
            print("bad address 'ledger-db'", flush=True)
            return "db=fail"
        try:
            urllib.request.urlopen("http://ledger-db/", timeout=2).read()
            return "db=ok"
        except OSError as e:
            print("ledger-db unreachable:", e, flush=True)
            return "db=fail"

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            body = (check() + "\n").encode()
            self.send_response(200)
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *a):
            pass

    def loop():
        import time
        while True:
            check()
            time.sleep(5)

    threading.Thread(target=loop, daemon=True).start()
    HTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporter
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: reporter}
  template:
    metadata:
      labels: {app: reporter}
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers: ["8.8.8.8"]
      containers:
      - name: reporter
        image: python:3.12-alpine
        command: ["python", "-u", "/app/reporter.py"]
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket: {port: 8080}
        volumeMounts:
        - {name: code, mountPath: /app}
      volumes:
      - name: code
        configMap: {name: reporter-code}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-db
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: ledger-db}
  template:
    metadata:
      labels: {app: ledger-db}
    spec:
      containers:
      - name: db
        image: hashicorp/http-echo:1.0
        args: ["-listen=:5678", "-text=ledger ready"]
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-db
  namespace: k8smissions
spec:
  selector:
    app: ledger-db
  ports:
  - port: 80
    targetPort: 5678

apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: k8smissions
spec:
  replicas: 2
  selector:
    matchLabels: {app: docs}
  template:
    metadata:
      labels: {app: docs}
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:5678", "-text=docs: engineering handbook"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: docs
  namespace: k8smissions
spec:
  selector:
    app: docs
  ports:
  - port: 80
    targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance
  namespace: k8smissions
spec:
  replicas: 1
  selector:
    matchLabels: {app: maintenance}
  template:
    metadata:
      labels: {app: maintenance}
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        args: ["-listen=:5678", "-text=maintenance: we are back soon"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: maintenance
  namespace: k8smissions
spec:
  selector:
    app: maintenance
  ports:
  - port: 80
    targetPort: 5678
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs
  namespace: k8smissions
spec:
  ingressClassName: nginx-internal
  rules:
  - host: docs.k8sm.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docs
            port:
              number: 80

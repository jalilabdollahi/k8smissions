apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-code
  namespace: k8smissions
data:
  portal.py: |
    import secrets, time
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import urlparse, parse_qs

    SESSIONS = {}  # sid -> (user, expires)
    TTL = 120

    class H(BaseHTTPRequestHandler):
        def reply(self, code, body, headers=()):
            self.send_response(code)
            for k, v in headers:
                self.send_header(k, v)
            self.end_headers()
            self.wfile.write((body + "\n").encode())

        def do_GET(self):
            u = urlparse(self.path)
            if u.path == "/login":
                user = parse_qs(u.query).get("user", ["anonymous"])[0]
                sid = secrets.token_hex(8)
                SESSIONS[sid] = (user, time.time() + TTL)
                return self.reply(200, "logged in as " + user, [("Set-Cookie", "sid=" + sid + "; Path=/")])
            sid = ""
            for part in self.headers.get("Cookie", "").split(";"):
                if part.strip().startswith("sid="):
                    sid = part.strip()[4:]
            s = SESSIONS.get(sid)
            if s and s[1] > time.time():
                return self.reply(200, "user=" + s[0])
            self.reply(401, "no session")

        def log_message(self, *a):
            pass

    HTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: k8smissions
spec:
  replicas: 3
  selector:
    matchLabels: {app: portal}
  template:
    metadata:
      labels: {app: portal}
    spec:
      containers:
      - name: portal
        image: python:3.12-alpine
        command: ["python", "-u", "/app/portal.py"]
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket: {port: 8080}
        volumeMounts:
        - {name: code, mountPath: /app}
      volumes:
      - name: code
        configMap: {name: portal-code}
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: k8smissions
spec:
  selector:
    app: portal
  ports:
  - port: 80
    targetPort: 8080
